<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material cost</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9edf0;--panel:#f6f8f9;--ink:#1b2126;--muted:#5b6670;--line:#c9d1d7;--acc:#c2410c;--acc-bg:#fff4ec;--focus:#0b6bcb;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--acc:#ff8a4c;--acc-bg:#2a1a10;--focus:#6cb4ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--acc:#ff8a4c;--acc-bg:#2a1a10;--focus:#6cb4ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding:12px 16px 28px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:26px;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg{display:inline-flex}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 11px;cursor:pointer}
.seg button+button{border-left:0}
.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.lang{margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.inputs{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
input[type=number]{font-family:var(--mono);font-size:15px;width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.main{border-color:var(--acc);background:var(--acc-bg)}
.kpi.main b{color:var(--acc)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right}
th:first-child,td:first-child{text-align:left;white-space:normal}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font)}
td input{width:90px}
tfoot td{font-weight:700;border-bottom:0}
.grp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.notes{font-size:13px;color:var(--muted)}
.notes a{color:var(--focus)}
.notes li{margin:2px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="t" data-k="title"></h1>
    <span class="tag t" data-k="tag"></span>
    <div class="seg lang" role="group" aria-label="Language"><button type="button" id="langEn">EN</button><button type="button" id="langRu">RU</button></div>
  </header>
  <div class="panel inputs">
    <label class="f"><span class="t" data-k="cars"></span><input type="number" id="cars" min="1" step="1" value="100"></label>
    <label class="f"><span class="t" data-k="allow"></span><input type="number" id="allow" min="0" max="200" step="5" value="20"></label>
    <div class="f"><span class="t" data-k="level" style="font-size:13px;color:var(--muted)"></span>
      <div class="seg" role="group"><button type="button" id="lvBulk" class="t" data-k="bulk"></button><button type="button" id="lvRetail" class="t" data-k="retail"></button></div></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="panel"><h2 class="t" data-k="bygroup"></h2><div class="grp" id="groups"></div></div>
  <div class="panel"><h2 class="t" data-k="buy"></h2><div class="tw"><table id="tbl"></table></div></div>
  <div class="panel notes"><h2 class="t" data-k="notes"></h2><ul id="notes"></ul></div>
</div>

for(const d of DATA){ if(d.kind==='tube') continue; const u=g(d.grp,d.mat); const sf=d.area*d.qty/144; if(d.grp==='FR'){u.FR+=sf;u.FL+=sf;} else u.FF+=sf; }
const tubeSet=DATA.filter(d=>d.mat==='tube3').reduce((s,d)=>s+d.cut+KERF,0);           // one side
const rectPcs=DATA.filter(d=>d.mat==='rect21').reduce((s,d)=>s+d.qty,0), rectLen=(DATA.find(d=>d.mat==='rect21')||{cut:0}).cut+KERF;
const domSide=0.4+0.164+0.4+0.4+4*0.0625;
let lang='ru', lvl='bulk'; try{lang=localStorage.getItem('fr4-lang')||'ru';}catch(e){}
const price={}; M.forEach(m=>price[m.k]={bulk:m.bulk,retail:m.retail});
const $=v=>'$'+v.toLocaleString('en-US',{maximumFractionDigits:0}), $2=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), n1=v=>v.toLocaleString('en-US',{maximumFractionDigits:1});
function calc(){
  const t=T[lang], N=Math.max(1,Math.round(+document.getElementById('cars').value||1)), A=Math.max(0,+document.getElementById('allow').value||0)/100;
  const rows=[]; const grpCost={FR:0,FL:0,FF:0}; let tot=0, lb=0;
  for(const m of M){
    const P=price[m.k][lvl]; let need1,needN,unit,stock,qty,sum,share,w;
    if(m.type==='sheet'){ const u=use[m.k]; if(!u) continue; need1=u.FR+u.FL+u.FF; unit=t.sf; needN=need1*N*(1+A);
      if(lvl==='bulk'){stock=t.sheet; qty=Math.ceil(needN/SHEET); sum=qty*P;} else {stock=t.rsheet+' ($/'+t.sf+')'; qty=needN; sum=needN*P;}
      share={FR:u.FR/need1,FL:u.FL/need1,FF:u.FF/need1}; w=need1*(1+A)*m.lb; }
    else if(m.type==='tube3'){ need1=2*tubeSet; unit=t.in; needN=need1*N;
      if(lvl==='bulk'){stock=t.stick; const per=Math.floor(STICK/tubeSet); qty=Math.ceil(2*N/per); sum=qty*P;} else {stock=t.rpiece; qty=2*N; sum=qty*P;}
      share={FR:.5,FL:.5,FF:0}; w=need1/12*m.lb; }
    else if(m.type==='rect'){ need1=rectPcs*rectLen; unit=t.in; needN=need1*N; stock=t.stick; const per=Math.floor(STICK/rectLen); qty=Math.ceil(rectPcs*N/per); sum=qty*P;
      share={FR:0,FL:0,FF:1}; w=need1/12*m.lb; }
    else { need1=2*domSide; unit=t.in; needN=need1*N; stock=t.rft; qty=Math.ceil(needN/12); sum=qty*P; share={FR:.5,FL:.5,FF:0}; w=need1/12*m.lb; }
    for(const k in grpCost) grpCost[k]+=sum*share[k]; tot+=sum; lb+=w;
    rows.push({m,need1,needN,unit,stock,qty,P,sum});
  }
  const pc=tot/N;
  document.getElementById('kpis').innerHTML=`<div class="kpi main"><b>${$(pc)}</b><span>${t.percar}</span></div><div class="kpi"><b>${$(tot)}</b><span>${t.total} (${N})</span></div>
   <div class="kpi"><b>${$(grpCost.FR/N)}</b><span>${t.perside}</span></div><div class="kpi"><b>${n1(lb)} lb</b><span>${t.weight}</span></div>`;
  document.getElementById('groups').innerHTML=['FR','FL','FF'].map(k=>`<div><div style="display:flex;justify-content:space-between;gap:8px"><span>${t[k]}</span><b style="font-family:var(--mono)">${$2(grpCost[k]/N)}</b></div><div class="bar"><i style="width:${(grpCost[k]/tot*100).toFixed(1)}%"></i></div></div>`).join('');
  const L=lang==='ru'?'ru':'en';
  let h=`<thead><tr><th>${t.mat}</th><th>${t.need1}</th><th>${t.needN}</th><th>${t.stock}</th><th>${t.qty}</th><th>${t.price}</th><th>${t.sum}</th></tr></thead><tbody>`;
  for(const r of rows){ h+=`<tr><td>${r.m[L]}</td><td>${n1(r.need1)} ${r.unit}</td><td>${n1(r.needN)} ${r.unit}</td><td>${r.stock}</td><td>${lvl==='retail'&&r.m.type==='sheet'?n1(r.qty):r.qty}</td>
     <td><input type="number" step="0.01" min="0" data-k="${r.m.k}" value="${r.P.toFixed(2)}" aria-label="${r.m[L]} ${t.price}"></td><td>${$(r.sum)}</td></tr>`; }
  h+=`</tbody><tfoot><tr><td>${t.itog}</td><td></td><td></td><td></td><td></td><td></td><td>${$(tot)}</td></tr></tfoot>`;
  const tbl=document.getElementById('tbl'); const focus=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.k:null;
  tbl.innerHTML=h;
  tbl.querySelectorAll('input').forEach(i=>{i.addEventListener('change',e=>{price[e.target.dataset.k][lvl]=Math.max(0,+e.target.value||0); calc();});});
  if(focus){const f=tbl.querySelector(`input[data-k="${CSS.escape(focus)}"]`); if(f) f.focus();}
  document.getElementById('notes').innerHTML=[t.n1,t.n2,t.n3,t.n4].map(x=>`<li>${x}</li>`).join('')+'<li>'+SRC.map(([a,u])=>`<a href="${u}" target="_blank" rel="noopener">${a}</a>`).join(' · ')+'</li>';
}
function texts(){ const t=T[lang]; document.querySelectorAll('.t').forEach(e=>e.textContent=t[e.dataset.k]); document.documentElement.lang=lang; document.title=t.title;
  document.getElementById('langEn').setAttribute('aria-pressed',String(lang==='en')); document.getElementById('langRu').setAttribute('aria-pressed',String(lang==='ru'));
  document.getElementById('lvBulk').setAttribute('aria-pressed',String(lvl==='bulk')); document.getElementById('lvRetail').setAttribute('aria-pressed',String(lvl==='retail')); calc(); }
document.getElementById('langEn').onclick=()=>{lang='en';try{localStorage.setItem('fr4-lang',lang)}catch(e){};texts();};
document.getElementById('langRu').onclick=()=>{lang='ru';try{localStorage.setItem('fr4-lang',lang)}catch(e){};texts();};
document.getElementById('lvBulk').onclick=()=>{lvl='bulk';texts();}; document.getElementById('lvRetail').onclick=()=>{lvl='retail';texts();};
['cars','allow'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
texts();
</script>
</body>
</html>
