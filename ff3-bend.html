<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FR-10 Bending plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9edf0;--panel:#f6f8f9;--ink:#1b2126;--muted:#5b6670;--line:#c9d1d7;--accent:#c2410c;--accent-bg:#fff4ec;--bend:#0b6bcb;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--accent:#ff8a4c;--accent-bg:#2a1a10;--bend:#6cb4ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--accent:#ff8a4c;--accent-bg:#2a1a10;--bend:#6cb4ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{padding:10px 16px 20px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:22px;margin:0;font-weight:700}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lang{margin-left:auto;display:flex}
.lang button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;cursor:pointer}
.lang button:first-child{border-radius:4px 0 0 4px}.lang button:last-child{border-radius:0 4px 4px 0;border-left:0}
.lang button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.viewer{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:4/3;min-height:280px}
canvas{display:block;width:100%;height:100%;touch-action:none}
.cap{position:absolute;left:10px;right:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:15px}
.cap b{color:var(--accent);font-family:var(--mono)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer;min-height:36px}
.ctl button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ctl input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.ctl .t{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:64px;text-align:right}
ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ol li{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;font-size:14px;display:flex;gap:8px}
ol li .n{font-family:var(--mono);color:var(--muted);min-width:18px}
ol li:hover{border-color:var(--accent)}
ol li.on{border-color:var(--accent);background:var(--accent-bg)}
ol li.on .n{color:var(--accent);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.err{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="ttl">FR-10 · план гибки и сварки</h1><span class="tag" id="tag"></span>
    <div class="lang" role="group" aria-label="Language"><button type="button" id="langEn">EN</button><button type="button" id="langRu">RU</button></div></header>
  <div class="main">
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <div class="viewer" id="viewer"><canvas id="c3d"></canvas><div class="cap" id="cap"></div></div>
      <div class="ctl">
        <button type="button" id="prev" aria-label="Previous step">◀</button>
        <button type="button" class="pri" id="play">▶</button>
        <button type="button" id="next" aria-label="Next step">▶|</button>
        <input type="range" id="slider" min="0" max="1000" value="0" aria-label="Timeline">
        <span class="t" id="tm"></span>
        <button type="button" id="rec"></button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px"><ol id="steps"></ol><div class="note" id="note"></div></div>
  </div>
</div>

function updBtn(){document.getElementById('play').textContent=playing?TX[lang].pause:TX[lang].play;document.getElementById('rec').textContent=recorder?TX[lang].recing:TX[lang].rec;}
document.getElementById('play').onclick=()=>{if(!playing&&T0>=TOTAL-0.01)T0=0;playing=!playing;last=performance.now();updBtn();};
document.getElementById('prev').onclick=()=>{playing=false;updBtn();const k=Math.max(cur-1,0);T0=k===0?0:START[k]+SEQ[k][0]-0.001;setT(T0);};
document.getElementById('next').onclick=()=>{playing=false;updBtn();const k=Math.min(cur+1,SEQ.length-1);T0=START[k]+SEQ[k][0]-0.001;setT(T0);};
document.getElementById('slider').oninput=e=>{playing=false;updBtn();T0=e.target.value/1000*TOTAL;setT(T0);};
document.getElementById('rec').onclick=()=>{
  if(recorder||!canvas.captureStream||!window.MediaRecorder)return;
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];const mt=types.find(x=>MediaRecorder.isTypeSupported(x))||'';
  const chunks=[];recorder=new MediaRecorder(canvas.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:6e6}:undefined);
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{const ext=(recorder.mimeType||'').includes('mp4')?'mp4':'webm';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));a.download=D.part+'_bending.'+ext;document.body.appendChild(a);a.click();a.remove();recorder=null;updBtn();};
  T0=0;setT(0);playing=true;last=performance.now();recorder.start();updBtn();};
function setLang(l){lang=l;try{localStorage.setItem('fr4-lang',l);}catch(e){}buildList();}
document.getElementById('langEn').onclick=()=>setLang('en');document.getElementById('langRu').onclick=()=>setLang('ru');
camera.position.copy(CA[0]);controls.target.copy(CA[1]);camera.lookAt(controls.target);
function resize(){const w=viewer.clientWidth,h=viewer.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();controls.handleResize&&controls.handleResize();}
new ResizeObserver(resize).observe(viewer);resize();
buildList();
(function loop(now){requestAnimationFrame(loop);
  if(playing){T0+=(now-last)/1000;last=now;if(T0>=TOTAL){T0=TOTAL;playing=false;updBtn();if(recorder)setTimeout(()=>recorder&&recorder.stop(),300);}setT(T0);}else last=now;
  controls.update();renderer.render(scene,camera);})(performance.now());
const q=new URLSearchParams(location.search);if(q.get('embed'))document.querySelector('header').style.display='none';if(q.get('autoplay')){playing=true;updBtn();}
if(q.get('t')){T0=+q.get('t');setT(T0);}
})();
</script>
</body>
