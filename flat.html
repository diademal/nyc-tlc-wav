<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sienna WAV Flat patterns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9edf0;--panel:#f6f8f9;--ink:#1b2126;--muted:#5b6670;--line:#c9d1d7;--metal:#dfe5ea;--edge:#26313a;--bend:#0b6bcb;--dim:#c2410c;--dim-bg:#fff4ec;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--metal:#2a343c;--edge:#cfd8df;--bend:#6cb4ff;--dim:#ff8a4c;--dim-bg:#2a1a10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--metal:#2a343c;--edge:#cfd8df;--bend:#6cb4ff;--dim:#ff8a4c;--dim-bg:#2a1a10;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding:12px 16px 28px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:26px;font-weight:700;margin:0;text-wrap:balance}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lang{margin-left:auto;display:flex}
.lang button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;cursor:pointer}
.lang button:first-child{border-radius:4px 0 0 4px}.lang button:last-child{border-radius:0 4px 4px 0;border-left:0}
.lang button[aria-pressed="true"]{background:var(--dim);border-color:var(--dim);color:#fff}
.sum{display:flex;flex-wrap:wrap;gap:8px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.sum b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.legend{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.legend i{display:inline-block;width:26px;height:0;border-top:2px dashed var(--bend);vertical-align:middle;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 .p{font-family:var(--mono);font-size:13px;color:var(--dim)}
.card h3 .q{margin-left:auto;font-family:var(--mono);font-size:13px;background:var(--dim-bg);color:var(--dim);border:1px solid var(--dim);border-radius:3px;padding:0 6px}
svg{width:100%;height:auto;display:block}
svg .m{fill:var(--metal);stroke:var(--edge);stroke-width:1.2;vector-effect:non-scaling-stroke;fill-rule:evenodd}
svg .b{stroke:var(--bend);stroke-width:1.4;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;fill:none}
svg .d{stroke:var(--dim);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
svg text{fill:var(--dim);font-family:var(--mono);font-size:12px}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.note{font-size:13px;color:var(--ink)}
.sec{grid-column:1/-1;margin:10px 0 0;font-size:19px;font-weight:700;border-top:2px solid var(--dim);padding-top:8px}
.planf{width:100%;height:700px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
svg .bl{fill:var(--bend);font-weight:600}
svg .lt{fill:none;stroke:#e02424;stroke-width:1.6;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
svg .ltx{fill:#e02424;font-weight:600}
.legend .lt{display:inline-block;width:14px;height:14px;border:2px dashed #e02424;border-radius:50%;vertical-align:middle;margin-right:4px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.dl a{font:600 12.5px/1 system-ui,sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--panel)}.dl a:hover{border-color:var(--bend)}
</style>
</head>

  bend:'bend line 90°',later:'red dashed — not laser cut, drill/cut at the end',mir:'FL mirrors FR: cut the same blanks, flipped',bentH:'Bent version — cut, bend, weld',plan:'Bending & welding plan (animation, can record a video)',weldH:'Welded version — separate plates',none:'No flat pattern for this part.',pdf:'Shop drawing (PDF)',allpdf:'All frame shop drawings (PDF)',alldxf:'All DXF files for cutting (ZIP)',shop:'Shop drawings — dimensions, metal thickness, bends, holes; DXF 1:1 for laser cutting',qty:'pcs',cut:'cut',mat:'material',size:'size'}};
const q=new URLSearchParams(location.search); const P=(q.get('p')||decodeURIComponent(location.hash.slice(1))||'Frame').toUpperCase();
function select(){
  // returns [{piece, mirror, partLabel}]
  const out=[];
  const add=(grp,flip)=>DATA.filter(d=>d.grp===grp&&!d.alt).forEach(d=>out.push({d,m:flip,part:flip?d.part.replace('FR-','FL-'):d.part}));
  if(P==='FRAME'){add('FF',false);add('FR',false);add('FR',true);}
  else if(P==='FR'||P==='FL'||P==='FF'){ if(P==='FL')add('FR',true); else add(P,false);}
  else if(P.startsWith('FL-')){const n='FR-'+P.slice(3); DATA.filter(d=>d.part===n).forEach(d=>out.push({d,m:true,part:P}));}
  else if(/^FF3-\d$/.test(P)) DATA.filter(d=>d.part==='FF-3'&&(d.ru.startsWith(P)||d.en.startsWith(P))).forEach(d=>out.push({d,m:false,part:P}));
  else DATA.filter(d=>d.part===P).forEach(d=>out.push({d,m:false,part:P}));
  return out;
}
const f=v=>{const w=Math.floor(v+1e-6),r=v-w,e=[[0,''],[.125,'⅛'],[.25,'¼'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[.75,'¾'],[.875,'⅞'],[1,'']];
  for(const [x,s] of e){ if(Math.abs(r-x)<0.02) return (x===1?w+1:(w||!s?w:''))+(s&&x!==1?(w?' ':'')+s:'')+'″'; } return v.toFixed(2)+'″';};
function isWide(d){return d.w>30||(d.alt&&d.kind==='sheet'&&(d.w/d.h>3||d.w>10));}
function svgFor(d,m){
  const k=Math.max(d.w,d.h*1.25)/(isWide(d)?(d.w>30?800:520):250), pad=(d.w/d.h>12?62:30)*k, fs=12*k, W=d.w+2*pad, H=d.h+2*pad;
  const tx=(x)=>(m?(d.w-x):x)+pad, ty=(y)=>d.h-y+pad;
  const path=r=>'M'+r.map(([x,y])=>tx(x).toFixed(3)+' '+ty(y).toFixed(3)).join('L')+'Z';
  let s=`<svg viewBox="0 0 ${W.toFixed(3)} ${H.toFixed(3)}" role="img" aria-label="${f(d.w)} × ${f(d.h)}">`;
  s+=`<path class="m" d="${path(d.ext)+d.holes.map(path).join('')}"/>`;
  d.bends.forEach(([a,b],i)=>{s+=`<line class="b" x1="${tx(a[0])}" y1="${ty(a[1])}" x2="${tx(b[0])}" y2="${ty(b[1])}"/>`;
    if(d.bl&&d.bl[i]){const mx=(tx(a[0])+tx(b[0]))/2,my=(ty(a[1])+ty(b[1]))/2;let ang=Math.atan2(ty(b[1])-ty(a[1]),tx(b[0])-tx(a[0]))*180/Math.PI;if(ang>90)ang-=180;if(ang<-90)ang+=180;const vert=Math.abs(Math.abs(ang)-90)<20;const top=ty(a[1])<ty(b[1])?[tx(a[0]),ty(a[1])]:[tx(b[0]),ty(b[1])];
      const lx=Math.min(Math.max(top[0],fs*3.2),W-fs*3.2); const lvl=(d.w/d.h>12)?(i%3):0; s+=vert?`<text class="bl" x="${lx}" y="${top[1]-fs*0.5-lvl*fs*1.25}" text-anchor="middle" style="font-size:${fs*1.05}px">${d.bl[i][lang==='ru'?0:1]}</text>`:`<text class="bl" transform="translate(${mx} ${my}) rotate(${ang}) translate(0 ${-fs*0.45})" text-anchor="middle" style="font-size:${fs*1.15}px">${d.bl[i][lang==='ru'?0:1]}</text>`;}});
  (d.later||[]).forEach((r,i)=>{s+=`<path class="lt" d="${path(r)}"/>`;const cx=r.reduce((a,p)=>a+p[0],0)/r.length,cy=r.reduce((a,p)=>a+p[1],0)/r.length,ry=Math.min(...r.map(p=>p[1]));
    s+=`<text class="ltx" x="${tx(cx)}" y="${ty(ry)+fs*1.1}" text-anchor="middle" style="font-size:${fs*0.95}px">${lang==='ru'?'сверлить после':'drill after'}</text>`;});
  const yb=pad+d.h+pad*0.4, xl=pad*0.55;
  s+=`<line class="d" x1="${pad}" y1="${yb}" x2="${pad+d.w}" y2="${yb}"/><text x="${pad+d.w/2}" y="${yb+fs*1.1}" text-anchor="middle" style="font-size:${fs}px">${f(d.w)}</text>`;
  s+=`<line class="d" x1="${xl}" y1="${pad}" x2="${xl}" y2="${pad+d.h}"/><text transform="translate(${xl-fs*0.35} ${pad+d.h/2}) rotate(-90)" text-anchor="middle" style="font-size:${fs}px">${f(d.h)}</text>`;
  return s+'</svg>';
}
let lang='ru'; try{lang=localStorage.getItem('fr4-lang')||'ru';}catch(e){}
function render(){
  const t=TXT[lang], L=lang==='ru'?0:1, items=select();
  document.documentElement.lang=lang;
  document.getElementById('langEn').setAttribute('aria-pressed',String(lang==='en')); document.getElementById('langRu').setAttribute('aria-pressed',String(lang==='ru'));
  const name=P==='FRAME'?'Frame — '+t.all:P;
  document.getElementById('ttl').textContent=t.flat+' · '+name; document.title=name+' · '+t.flat;
  document.getElementById('tag').textContent=t.tag;
  const g=document.getElementById('grid'); g.innerHTML='';
  if(!items.length){g.innerHTML=`<div class="empty card wide">${t.none}</div>`; document.getElementById('sum').innerHTML=''; return;}
  let n=0,sf=0,tb=0;
  const hasAlt=items.some(x=>x.d.alt); let sec='';
  const PLAN={};['1','2','3','4','5','7','8','10'].forEach(n=>{PLAN['FR-'+n]=PLAN['FL-'+n]='fr'+n+'-bend.html';});PLAN['FF-1']='ff1-bend.html';PLAN['FF-3']='ff3-bend.html';['FF3-1','FF3-2'].forEach(k=>PLAN[k]='ff3-bend.html');
  { const pdfs=[...new Set(items.map(x=>x.d.pdf).filter(Boolean))]; const c=document.createElement('div'); c.className='card wide shop';
    c.innerHTML=`<h3>${t.shop}</h3><div class="dl">`+pdfs.map(p=>`<a href="drawings/${p}" target="_blank" rel="noopener">${t.pdf}: ${p.replace('.pdf','')}</a>`).join('')+`<a href="drawings/ALL_shop_drawings.pdf" target="_blank" rel="noopener">${t.allpdf}</a><a href="drawings/ALL_dxf.zip" download>${t.alldxf}</a></div>`; g.appendChild(c); }
  if(!hasAlt&&PLAN[P]){const c=document.createElement('div');c.className='card wide';c.innerHTML=`<h3>${t.plan}</h3><iframe class="planf" loading="lazy" src="${PLAN[P]}?embed=1" title="${t.plan}"></iframe>`+(P.startsWith('FL')?`<div class="note">${t.mir}</div>`:'');g.appendChild(c);}
  for(const {d,m,part} of items.sort((a,b)=>(b.d.alt?1:0)-(a.d.alt?1:0))){
    const k=d.alt?'bent':'weld';
    if(hasAlt&&k!==sec){sec=k;const h=document.createElement('h2');h.className='sec';h.textContent=k==='bent'?t.bentH:t.weldH;g.appendChild(h);
      if(k==='bent'&&PLAN[P]){const c=document.createElement('div');c.className='card wide';c.innerHTML=`<h3>${t.plan}</h3><iframe class="planf" loading="lazy" src="${PLAN[P]}?embed=1" title="${t.plan}"></iframe>`+(P.startsWith('FL')?`<div class="note">${t.mir}</div>`:'');g.appendChild(c);}}
    if(d.alt){const c=document.createElement('div');c.className='card'+(isWide(d)?' wide':'');const nm=lang==='ru'?d.ru:d.en,note=lang==='ru'?d.nru:d.nen;
      c.innerHTML=`<h3><span class="p">${part}</span>${nm}<span class="q">× ${d.qty}</span></h3>${d.kind==='tube'?'':svgFor(d,m)}
      <div class="meta"><span>${d.kind==='tube'?t.cut+' '+f(d.cut):t.size+': '+f(d.w)+' × '+f(d.h)}</span><span>${t.mat}: ${MATN[d.mat][L]}</span>${d.kind==='sheet'?`<span>${(d.area/144).toFixed(2)} ${t.sheet}</span>`:''}</div>
      ${note?`<div class="note">${note}</div>`:''}${d.pdf?`<div class="dl"><a href="drawings/${d.pdf}" target="_blank" rel="noopener">${t.pdf}</a>${d.dxf?`<a href="drawings/${d.dxf}" download>DXF</a>`:''}</div>`:''}`; g.appendChild(c); continue;}
    n+=d.qty; if(d.kind==='tube') tb+=d.cut*d.qty; else sf+=d.area*d.qty/144;
    const c=document.createElement('div'); c.className='card'+(d.w>30?' wide':'');
    const nm=lang==='ru'?d.ru:d.en, note=lang==='ru'?d.nru:d.nen;
    c.innerHTML=`<h3><span class="p">${part}</span>${nm}<span class="q">× ${d.qty}</span></h3>${svgFor(d,m)}
      <div class="meta"><span>${t.size}: ${f(d.w)} × ${f(d.h)}</span><span>${t.mat}: ${MATN[d.mat][L]}</span>${d.kind==='sheet'?`<span>${(d.area/144).toFixed(2)} ${t.sheet}</span>`:''}</div>
      ${note?`<div class="note">${note}</div>`:''}${d.pdf?`<div class="dl"><a href="drawings/${d.pdf}" target="_blank" rel="noopener">${t.pdf}</a>${d.dxf?`<a href="drawings/${d.dxf}" download>DXF</a>`:''}</div>`:''}`;
    g.appendChild(c);
  }
  document.getElementById('sum').innerHTML=`<div><b>${n}</b><span>${t.pcs}</span></div><div><b>${sf.toFixed(1)}</b><span>${t.area} (${t.sheet})</span></div>`+(tb?`<div><b>${f(tb)}</b><span>${t.tube}</span></div>`:'');
  document.getElementById('legend').innerHTML=`<span><i></i>${t.bend}</span>`+(items.some(x=>x.d.later&&x.d.later.length)?`<span><b class="lt"></b>${t.later}</span>`:'')+(items.some(x=>x.m)?`<span>${t.mir}</span>`:'');
}
function setLang(l){lang=l; try{localStorage.setItem('fr4-lang',l);}catch(e){} render();}
document.getElementById('langEn').onclick=()=>setLang('en'); document.getElementById('langRu').onclick=()=>setLang('ru');
render();
</script>
