<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sienna WAV Flat patterns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9edf0;--panel:#f6f8f9;--ink:#1b2126;--muted:#5b6670;--line:#c9d1d7;--metal:#dfe5ea;--edge:#26313a;--bend:#0b6bcb;--dim:#c2410c;--dim-bg:#fff4ec;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--metal:#2a343c;--edge:#cfd8df;--bend:#6cb4ff;--dim:#ff8a4c;--dim-bg:#2a1a10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--metal:#2a343c;--edge:#cfd8df;--bend:#6cb4ff;--dim:#ff8a4c;--dim-bg:#2a1a10;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding:12px 16px 28px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:26px;font-weight:700;margin:0;text-wrap:balance}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lang{margin-left:auto;display:flex}
.lang button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;cursor:pointer}
.lang button:first-child{border-radius:4px 0 0 4px}.lang button:last-child{border-radius:0 4px 4px 0;border-left:0}
.lang button[aria-pressed="true"]{background:var(--dim);border-color:var(--dim);color:#fff}
.sum{display:flex;flex-wrap:wrap;gap:8px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.sum b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.legend{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.legend i{display:inline-block;width:26px;height:0;border-top:2px dashed var(--bend);vertical-align:middle;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 .p{font-family:var(--mono);font-size:13px;color:var(--dim)}
.card h3 .q{margin-left:auto;font-family:var(--mono);font-size:13px;background:var(--dim-bg);color:var(--dim);border:1px solid var(--dim);border-radius:3px;padding:0 6px}
svg{width:100%;height:auto;display:block}
svg .m{fill:var(--metal);stroke:var(--edge);stroke-width:1.2;vector-effect:non-scaling-stroke;fill-rule:evenodd}
svg .b{stroke:var(--bend);stroke-width:1.4;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;fill:none}
svg .d{stroke:var(--dim);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
svg text{fill:var(--dim);font-family:var(--mono);font-size:12px}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.note{font-size:13px;color:var(--ink)}
.sec{grid-column:1/-1;margin:10px 0 0;font-size:19px;font-weight:700;border-top:2px solid var(--dim);padding-top:8px}
.planf{width:100%;height:700px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
svg .bl{fill:var(--bend);font-weight:600}
svg .lt{fill:none;stroke:#e02424;stroke-width:1.6;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
svg .ltx{fill:#e02424;font-weight:600}
.legend .lt{display:inline-block;width:14px;height:14px;border:2px dashed #e02424;border-radius:50%;vertical-align:middle;margin-right:4px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.dl a{font:600 12.5px/1 system-ui,sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--panel)}.dl a:hover{border-color:var(--bend)}
</style>
</head>

</div>

      <div class="meta"><span>${d.kind==='tube'?t.cut+' '+f(d.cut):t.size+': '+f(d.w)+' × '+f(d.h)}</span><span>${t.mat}: ${MATN[d.mat][L]}</span>${d.kind==='sheet'?`<span>${(d.area/144).toFixed(2)} ${t.sheet}</span>`:''}</div>
      ${note?`<div class="note">${note}</div>`:''}${d.pdf?`<div class="dl"><a href="drawings/${d.pdf}" target="_blank" rel="noopener">${t.pdf}</a>${d.dxf?`<a href="drawings/${d.dxf}" download>DXF</a>`:''}</div>`:''}`; g.appendChild(c); continue;}
    n+=d.qty; if(d.kind==='tube') tb+=d.cut*d.qty; else sf+=d.area*d.qty/144;
    const c=document.createElement('div'); c.className='card'+(d.w>30?' wide':'');
    const nm=lang==='ru'?d.ru:d.en, note=lang==='ru'?d.nru:d.nen;
    c.innerHTML=`<h3><span class="p">${part}</span>${nm}<span class="q">× ${d.qty}</span></h3>${svgFor(d,m)}
      <div class="meta"><span>${t.size}: ${f(d.w)} × ${f(d.h)}</span><span>${t.mat}: ${MATN[d.mat][L]}</span>${d.kind==='sheet'?`<span>${(d.area/144).toFixed(2)} ${t.sheet}</span>`:''}</div>
      ${note?`<div class="note">${note}</div>`:''}${d.pdf?`<div class="dl"><a href="drawings/${d.pdf}" target="_blank" rel="noopener">${t.pdf}</a>${d.dxf?`<a href="drawings/${d.dxf}" download>DXF</a>`:''}</div>`:''}`;
    g.appendChild(c);
  }
  document.getElementById('sum').innerHTML=`<div><b>${n}</b><span>${t.pcs}</span></div><div><b>${sf.toFixed(1)}</b><span>${t.area} (${t.sheet})</span></div>`+(tb?`<div><b>${f(tb)}</b><span>${t.tube}</span></div>`:'');
  document.getElementById('legend').innerHTML=`<span><i></i>${t.bend}</span>`+(items.some(x=>x.d.later&&x.d.later.length)?`<span><b class="lt"></b>${t.later}</span>`:'')+(items.some(x=>x.m)?`<span>${t.mir}</span>`:'');
}
function setLang(l){lang=l; try{localStorage.setItem('fr4-lang',l);}catch(e){} render();}
document.getElementById('langEn').onclick=()=>setLang('en'); document.getElementById('langRu').onclick=()=>setLang('ru');
render();
</script>
