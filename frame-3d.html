<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Assembly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e9edf0; --panel:#f6f8f9; --ink:#1b2126; --muted:#5b6670; --line:#c9d1d7;
  --steel:#8f9aa4; --plate:#a9b3bb; --dim:#c2410c; --dim-bg:#fff4ec; --focus:#0b6bcb;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171b; --panel:#1a2126; --ink:#e3e8ec; --muted:#95a1ab; --line:#2c353c;
    --steel:#7d8993; --plate:#95a1ab; --dim:#ff8a4c; --dim-bg:#2a1a10; --focus:#6cb4ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171b; --panel:#1a2126; --ink:#e3e8ec; --muted:#95a1ab; --line:#2c353c;
  --steel:#7d8993; --plate:#95a1ab; --dim:#ff8a4c; --dim-bg:#2a1a10; --focus:#6cb4ff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding:12px 16px 28px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.viewer{position:relative;height:min(68vh,640px);min-height:360px;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,var(--panel),var(--bg))}
#c3d,#labels{position:absolute;inset:0}
#c3d{width:100%;height:100%;display:block;touch-action:none}
#labels{pointer-events:none}
.dim{font-family:var(--mono);font-size:calc(12px * var(--ds,1));font-weight:500;color:var(--dim);background:var(--dim-bg);border:1px solid var(--dim);
  padding:1px 5px;border-radius:3px;white-space:nowrap;line-height:1.3}
.dim.note{color:var(--ink);border-color:var(--line);background:var(--panel)}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.bar button,.bar label{font-family:var(--font);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:4px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bar button:hover,.bar label:hover{border-color:var(--muted)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar input{accent-color:var(--dim);margin:0}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.spec section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.spec h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.spec dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0}
.spec dt{color:var(--ink)}
.spec dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--dim)}
.spec .dist{grid-column:1/-1}
.spec .dist dl{grid-template-columns:repeat(auto-fill,minmax(150px,auto) minmax(110px,auto));column-gap:24px}
.distnote{margin:0 0 8px;font-size:13px;color:var(--muted)}
.spec .dist dd{white-space:nowrap}
.pick{cursor:pointer;border-radius:3px}
.pick:hover,.pick:focus-visible{background:var(--dim-bg);outline:none}
.pick.on{background:var(--dim-bg);box-shadow:inset 3px 0 0 #1a73e8}
.dim.hl{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:600;font-size:14px;padding:3px 8px;pointer-events:auto;cursor:pointer;z-index:5}
.nodims .dim:not(.hl){display:none!important}
.err{padding:20px;color:var(--ink)}
header{position:relative}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;order:3;margin-left:auto}
.lang button{font-family:var(--mono);font-size:13px;border:0;background:var(--panel);color:var(--muted);padding:5px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--dim);color:var(--panel)}
.lang button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
@media (max-width:520px){.dim{font-size:calc(10.5px * var(--ds,1));padding:0 4px}}
#btnDims[aria-pressed="false"]{border-color:var(--dim);color:var(--dim)}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1 class="i18n">Frame Assembly (right side)</h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langEn" aria-pressed="true">EN</button>
      <button type="button" id="langRu" aria-pressed="false">RU</button>
    </div>
    <span class="tag i18n">Sienna WAV · all dimensions in inches · parts built so far</span>
  </header>
  <div class="viewer" id="viewer">
    <canvas id="c3d"></canvas>
    <div id="labels"></div>
    <div class="hint i18n">Rotate with one finger, zoom with two</div>
  </div>
  <div class="bar" role="group" aria-label="View">
    <button id="btnReset" type="button" class="i18n">Reset view</button>
    <button id="btnDims" type="button" aria-pressed="true"><span class="i18n" id="dimsTxt">Hide dimensions</span></button>
    <span id="partToggles" style="display:contents"></span>
  </div>
  <div class="spec">
    <section class="dist">
      <h2 class="i18n">Joints (right side, FR)</h2>
      <p class="i18n distnote">Tap a row to see it on the model.</p>
      <dl id="distList"></dl>
    </section>
  </div>
</div>

  function clearDistance(){while(hlGroup.children.length)hlGroup.remove(hlGroup.children[0]); if(hlLabel){hlLabel.parent.remove(hlLabel);hlLabel.element.remove();hlLabel=null;} hlRows.forEach(e=>e.classList.remove('on')); hlRows=[];}
  function showDistance(pts,text,dt,dd){ if(hlRows[0]===dt){clearDistance();return;} clearDistance(); hlRows=[dt,dd]; hlRows.forEach(e=>e.classList.add('on'));
    const v=pts.map(p=>new THREE.Vector3(...p));
    for(let i=0;i<v.length-1;i++){const a=v[i],b=v[i+1],len=a.distanceTo(b); if(len<1e-6)continue; const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,len,10),hlMat);
      cyl.position.copy(a.clone().add(b).multiplyScalar(0.5)); cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize()); cyl.renderOrder=10; hlGroup.add(cyl);}
    [v[0],v[v.length-1]].forEach(p=>{const s=new THREE.Mesh(new THREE.SphereGeometry(0.18,16,12),hlMat); s.position.copy(p); s.renderOrder=10; hlGroup.add(s);});
    const el=document.createElement('div'); el.className='dim hl'; el.textContent=text+'  ✕'; el.addEventListener('click',clearDistance);
    hlLabel=new THREE.CSS2DObject(el); hlLabel.position.copy(v[0].clone().add(v[v.length-1]).multiplyScalar(0.5)); hlGroup.add(hlLabel);
    viewer.scrollIntoView({behavior:'smooth',block:'center'});}
  const ROWS=[['FR-10 on FR-9: 0.2″ from the FR-9 end, on the outer side','0.2″',[[7.55,3,3],[7.75,3,3]]],
    ['FR-6 and FR-9 on one line, gap between them','8″',[[-8,1.5,3],[0,1.5,3]]],
    ['FR-8 bridges FR-9 and FR-6, arcs down, 1″ above the tubes','—',[[-10,1.5,4],[2,1.5,4]]],
    ['FR-10 edge to FR-8','2 ½″',[[2,1.5,4],[FR10_IN,1.5,4]]],
    ['FR-9 length','7 ¾″',[[0,0,0],[7.75,0,0]]],['FR-6 length','14 ¼″',[[-22.25,0,0],[-8,0,0]]],
    ['FR-7 on FR-6: edges H–G across the FR-6 top, tab down the outer side, against the FR-8 end','—',[[-10,0,3],[-10,3,3]]],
    ['FR-5 hooks the bottom outer edge of FR-6: A–G on the side face, G–F under the tube, against FR-7','—',[[-15.46,3,0],[-12.79,3,0]]],
    ['FR-4 — not placed yet','',null]];
  const dl=document.getElementById('distList');
  for(const [lab,val,pts] of ROWS){const dt=document.createElement('dt'); dt.className='i18n'; dt.textContent=lab; const dd=document.createElement('dd'); dd.textContent=val;
    if(pts){[dt,dd].forEach(el=>{el.classList.add('pick'); el.tabIndex=0; el.setAttribute('role','button'); const go=()=>showDistance(pts,val||lab,dt,dd);
      el.addEventListener('click',go); el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});}
    dl.append(dt,dd);}
  // part toggles
  const tg=document.getElementById('partToggles');
  for(const k of Object.keys(groups)){const lab=document.createElement('label'); const id='chk'+k; lab.htmlFor=id; lab.innerHTML='<input id="'+id+'" type="checkbox" checked> '+NAMES[k];
    lab.querySelector('input').addEventListener('change',e=>{groups[k].visible=e.target.checked;}); tg.appendChild(lab);}
  function applyTheme(){edgeMat.color.set(css('--ink')); dimMat.color.set(css('--dim'));}
  applyTheme(); new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
  const labelsEl=document.getElementById('labels'); let refDist=1;
  function resetView(){camera.up.set(0,1,0); const k=viewer.clientWidth<520?2.3:1; camera.position.set(target.x-14*k,target.y+12*k,target.z-30*k); controls.target.copy(target); controls.update(); refDist=camera.position.distanceTo(controls.target);}
  function resize(){const w=viewer.clientWidth,h=viewer.clientHeight; renderer.setSize(w,h,false); labelRenderer.setSize(w,h); camera.aspect=w/h; camera.fov=w<520?48:35; camera.updateProjectionMatrix(); controls.handleResize();}
  new ResizeObserver(resize).observe(viewer); resize(); resetView();
  document.getElementById('btnReset').addEventListener('click',()=>{resetView();clearDistance();});
  document.getElementById('btnDims').addEventListener('click',e=>{grpDims.visible=!grpDims.visible; document.body.classList.toggle('nodims',!grpDims.visible); e.currentTarget.setAttribute('aria-pressed',String(grpDims.visible)); document.getElementById('dimsTxt').dataset.en=grpDims.visible?'Hide dimensions':'Show dimensions'; setLang(curLang);});
  const RU={"Frame Assembly (right side)":"Сборка рамы (правая сторона)","Sienna WAV · all dimensions in inches · parts built so far":"Sienna WAV · все размеры в дюймах · детали, что уже готовы",
    "Rotate with one finger, zoom with two":"Крутить — одним пальцем, приближать — двумя","Reset view":"Сбросить вид","Hide dimensions":"Скрыть размеры","Show dimensions":"Показать размеры",
    "Joints (right side, FR)":"Соединения (правая сторона, FR)","Tap a row to see it on the model.":"Нажмите на строку — покажу на модели.",
    "FR-10 on FR-9: 0.2″ from the FR-9 end, on the outer side":"FR-10 на FR-9: 0.2″ от торца FR-9, с внешней стороны","FR-6 and FR-9 on one line, gap between them":"FR-6 и FR-9 на одной линии, зазор",
    "FR-8 bridges FR-9 and FR-6, arcs down, 1″ above the tubes":"FR-8 лежит на FR-9 и FR-6 дугами вниз, верх на 1″ выше труб","FR-10 edge to FR-8":"От края FR-10 до FR-8",
    "FR-9 length":"Длина FR-9","FR-6 length":"Длина FR-6","FR-4 — not placed yet":"FR-4 — ещё не поставлен","FR-5 hooks the bottom outer edge of FR-6: A–G on the side face, G–F under the tube, against FR-7":"FR-5 на нижнем внешнем углу FR-6: A–G к боковой стенке, G–F под трубой, прижат к FR-7","FR-7 on FR-6: edges H–G across the FR-6 top, tab down the outer side, against the FR-8 end":"FR-7 на FR-6: края H–G поперёк верха FR-6, лапка вниз по внешней стороне, прижат к торцу FR-8","gap 8″":"зазор 8″"};
  document.querySelectorAll('.i18n').forEach(el=>{el.dataset.en=el.textContent;});
  const btnEn=document.getElementById('langEn'),btnRu=document.getElementById('langRu'); let curLang='en';
  function setLang(lang){curLang=lang; document.querySelectorAll('.i18n').forEach(el=>{const en=el.dataset.en; el.textContent=lang==='ru'?(RU[en]||en):en;}); dimEls.forEach(el=>{const en=el.dataset.en; el.textContent=lang==='ru'?(RU[en]||en):en;});
    document.documentElement.lang=lang; btnEn.setAttribute('aria-pressed',String(lang==='en')); btnRu.setAttribute('aria-pressed',String(lang==='ru')); try{localStorage.setItem('fr4-lang',lang);}catch(e){}}
  btnEn.addEventListener('click',()=>setLang('en')); btnRu.addEventListener('click',()=>setLang('ru'));
  let startLang='en'; try{startLang=localStorage.getItem('fr4-lang')||'en';}catch(e){} setLang(startLang);
  (function loop(){requestAnimationFrame(loop); controls.update(); const ds=Math.min(3,Math.max(0.6,refDist/camera.position.distanceTo(controls.target))); labelsEl.style.setProperty('--ds',ds.toFixed(3)); renderer.render(scene,camera); labelRenderer.render(scene,camera);})();
})();
