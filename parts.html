<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sienna WAV Frame Parts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9edf0;--panel:#f6f8f9;--ink:#1b2126;--muted:#5b6670;--line:#c9d1d7;--acc:#c2410c;--focus:#0b6bcb;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--acc:#ff8a4c;--focus:#6cb4ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--acc:#ff8a4c;--focus:#6cb4ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 16px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.top b{font-size:15px;letter-spacing:.02em;white-space:nowrap;padding-bottom:8px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav::-webkit-scrollbar{display:none}
nav a{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:8px 14px;border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--acc);background:var(--bg);border-color:var(--line);margin-bottom:-1px;box-shadow:inset 0 3px 0 var(--acc)}
nav a:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
</style>
</head>
<body>
<div class="top">
  <b>Sienna WAV · Frame parts</b>
  <nav id="tabs" aria-label="Parts"></nav>
</div>
<iframe id="view" title="Part 3D view"></iframe>
<script>
// Add new parts here: [tab name, page file]
const PARTS = [
  ['FR-4', 'fr4-3d.html'],
  ['FR-6', 'fr6-3d.html'],
  ['FR-9', 'fr9-3d.html'],
  ['FR-10', 'fr10-3d.html'],
];
const tabs = document.getElementById('tabs'), view = document.getElementById('view');
PARTS.forEach(([name]) => { const a = document.createElement('a'); a.href = '#' + name; a.textContent = name; tabs.appendChild(a); });
function show(){
  const want = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  const part = PARTS.find(p => p[0] === want) || PARTS[0];
  tabs.querySelectorAll('a').forEach(a => {
    const on = a.textContent === part[0];
    if (on) { a.setAttribute('aria-current', 'page'); a.scrollIntoView({block:'nearest', inline:'nearest'}); }
    else a.removeAttribute('aria-current');
  });
  if (view.dataset.src !== part[1]) { view.dataset.src = part[1]; view.src = part[1]; }
  document.title = part[0] + ' · Sienna WAV Frame Parts';
}
window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
