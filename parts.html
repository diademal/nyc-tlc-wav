<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sienna WAV Frame Parts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9edf0;--panel:#f6f8f9;--ink:#1b2126;--muted:#5b6670;--line:#c9d1d7;--acc:#c2410c;--focus:#0b6bcb;--shadow:0 10px 30px rgba(20,30,40,.18);
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--acc:#ff8a4c;--focus:#6cb4ff;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--acc:#ff8a4c;--focus:#6cb4ff;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;height:100dvh}
.top{position:relative;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel);z-index:5}
.top b{font-size:14px;letter-spacing:.02em;white-space:nowrap;color:var(--muted);font-weight:600;margin-right:4px}
button{font:inherit;color:inherit}
.pick{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:15px;font-weight:500;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;min-width:120px;justify-content:space-between}
.pick .cur{color:var(--acc)}
.pick svg{transition:transform .15s}
.pick[aria-expanded="true"] svg{transform:rotate(180deg)}
.step{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;color:var(--muted)}
.step:hover,.pick:hover{border-color:var(--muted);color:var(--ink)}
.pick:focus-visible,.step:focus-visible,.menu a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.menu{position:absolute;top:calc(100% + 6px);left:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px 12px;width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 80px);overflow:auto}
.menu[hidden]{display:none}
.grp{margin-top:6px}
.grp:first-child{margin-top:0}
.grp h3{margin:6px 2px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.menu a{display:block;text-align:center;font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;padding:8px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.menu a:hover{border-color:var(--acc)}
.menu a[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:var(--panel)}
iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
@media (max-width:520px){.top b{display:none}.pick{flex:1}}
</style>
</head>
<body>
<div class="top">
  <b>Sienna WAV · Frame parts</b>
  <button class="step" id="prev" type="button" aria-label="Previous part"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="pick" id="pick" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><span class="cur" id="cur">FR-1</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="step" id="next" type="button" aria-label="Next part"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <div class="menu" id="menu" hidden></div>
</div>
<iframe id="view" title="Part 3D view"></iframe>
<script>
// Add new parts here: [group, name, page file]
const PARTS = [
  ['Assembly', 'Frame', 'frame-3d.html'],
  ['Right side (FR)', 'FR-1', 'fr1-3d.html'],
  ['Right side (FR)', 'FR-2', 'fr2-3d.html'],
  ['Right side (FR)', 'FR-3', 'fr3-3d.html'],
  ['Right side (FR)', 'FR-4', 'fr4-3d.html'],
  ['Right side (FR)', 'FR-5', 'fr5-3d.html'],
  ['Right side (FR)', 'FR-6', 'fr6-3d.html'],
  ['Right side (FR)', 'FR-7', 'fr7-3d.html'],
  ['Right side (FR)', 'FR-8', 'fr8-3d.html'],
  ['Right side (FR)', 'FR-9', 'fr9-3d.html'],
  ['Right side (FR)', 'FR-10', 'fr10-3d.html'],
  ['Front (FF)', 'FF-1', 'ff1-3d.html'],
  ['Front (FF)', 'FF-3', 'ff3-3d.html'],
];
const DEFAULT = 'FR-1';
const menu = document.getElementById('menu'), pick = document.getElementById('pick'), cur = document.getElementById('cur'), view = document.getElementById('view');
const groups = [...new Set(PARTS.map(p => p[0]))];
groups.forEach(g => {
  const sec = document.createElement('div'); sec.className = 'grp';
  const h = document.createElement('h3'); h.textContent = g; sec.appendChild(h);
  const chips = document.createElement('div'); chips.className = 'chips';
  PARTS.filter(p => p[0] === g).forEach(([, name]) => { const a = document.createElement('a'); a.href = '#' + name; a.textContent = name; chips.appendChild(a); });
  sec.appendChild(chips); menu.appendChild(sec);
});
function openMenu(on){ menu.hidden = !on; pick.setAttribute('aria-expanded', String(on)); if (on) (menu.querySelector('[aria-current]') || menu.querySelector('a')).focus(); }
pick.addEventListener('click', () => openMenu(menu.hidden));
menu.addEventListener('click', e => { if (e.target.closest('a')) openMenu(false); });
document.addEventListener('click', e => { if (!menu.hidden && !e.target.closest('.menu') && !e.target.closest('#pick')) openMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { openMenu(false); pick.focus(); } });
function current(){
  const want = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  return PARTS.findIndex(p => p[1].toUpperCase() === want);
}
function go(d){ let i = current(); if (i < 0) i = PARTS.findIndex(p => p[1] === DEFAULT); i = (i + d + PARTS.length) % PARTS.length; location.hash = PARTS[i][1]; }
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
function show(){
  let i = current(); if (i < 0) i = PARTS.findIndex(p => p[1] === DEFAULT);
  const part = PARTS[i];
  cur.textContent = part[1];
  menu.querySelectorAll('a').forEach(a => { if (a.textContent === part[1]) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (view.dataset.src !== part[2]) { view.dataset.src = part[2]; view.src = part[2]; }
  document.title = part[1] + ' · Sienna WAV Frame Parts';
}
window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
