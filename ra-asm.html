<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramp Assembly · Sienna WAV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e9edf0; --panel:#f6f8f9; --ink:#1b2126; --muted:#5b6670; --line:#c9d1d7;
  --steel:#8f9aa4; --plate:#a9b3bb; --dim:#c2410c; --dim-bg:#fff4ec; --focus:#0b6bcb;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171b; --panel:#1a2126; --ink:#e3e8ec; --muted:#95a1ab; --line:#2c353c;
    --steel:#7d8993; --plate:#95a1ab; --dim:#ff8a4c; --dim-bg:#2a1a10; --focus:#6cb4ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171b; --panel:#1a2126; --ink:#e3e8ec; --muted:#95a1ab; --line:#2c353c;
  --steel:#7d8993; --plate:#95a1ab; --dim:#ff8a4c; --dim-bg:#2a1a10; --focus:#6cb4ff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding:12px 16px 28px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.viewer{position:relative;height:min(68vh,640px);min-height:360px;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,var(--panel),var(--bg))}
#c3d,#labels{position:absolute;inset:0}
#c3d{width:100%;height:100%;display:block;touch-action:none}
#labels{pointer-events:none}
.dim{font-family:var(--mono);font-size:calc(12px * var(--ds,1));font-weight:500;color:var(--dim);background:var(--dim-bg);border:1px solid var(--dim);
  padding:1px 5px;border-radius:3px;white-space:nowrap;line-height:1.3}
.dim.note{color:var(--ink);border-color:var(--line);background:var(--panel)}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.bar button,.bar label{font-family:var(--font);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:4px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bar button:hover,.bar label:hover{border-color:var(--muted)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar input{accent-color:var(--dim);margin:0}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.spec section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.spec h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.spec dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0}
.spec dt{color:var(--ink)}
.spec dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--dim)}
.spec .dist{grid-column:1/-1}
.spec .dist dl{grid-template-columns:repeat(auto-fill,minmax(150px,auto) minmax(110px,auto));column-gap:24px}
.distnote{margin:0 0 8px;font-size:13px;color:var(--muted)}
.spec .dist dd{white-space:nowrap}
.pick{cursor:pointer;border-radius:3px}
.pick:hover,.pick:focus-visible{background:var(--dim-bg);outline:none}
.pick.on{background:var(--dim-bg);box-shadow:inset 3px 0 0 #1a73e8}
.dim.hl{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:600;font-size:14px;padding:3px 8px;pointer-events:auto;cursor:pointer;z-index:5}
.nodims .dim:not(.hl){display:none!important}
.err{padding:20px;color:var(--ink)}
header{position:relative}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;order:3;margin-left:auto}
.lang button{font-family:var(--mono);font-size:13px;border:0;background:var(--panel);color:var(--muted);padding:5px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--dim);color:var(--panel)}
.lang button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
@media (max-width:520px){.dim{font-size:calc(10.5px * var(--ds,1));padding:0 4px}}
#btnDims[aria-pressed="false"]{border-color:var(--dim);color:var(--dim)}
</style>
<style>
.lang button,.mode button{font-family:var(--mono);font-size:13px;padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"],.mode button[aria-pressed="true"]{background:var(--dim);border-color:var(--dim);color:var(--panel)}
.matbox{border:2px solid var(--dim);background:var(--dim-bg);color:var(--dim);border-radius:6px;padding:8px 12px;font-weight:700}
.pt{font-family:var(--mono);font-size:15px;font-weight:700;color:#c62828;text-shadow:0 0 3px var(--panel),0 0 3px var(--panel)}
.links a{font-family:var(--mono);font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--panel);display:inline-block;margin:0 6px 6px 0}
.links a:hover{border-color:var(--dim)}
</style>
<style>
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts label{font-family:var(--font);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.parts label.off{opacity:.55}
.sw{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.35);display:inline-block}
.plab{font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;background:#2f3b45;border-radius:3px;padding:1px 6px;white-space:nowrap}
.plab.new{background:#c2410c}
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.steps button{font-family:var(--mono);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer}
.steps button:disabled{opacity:.4;cursor:default}
#stepTxt{font-size:15px}
#stepNo{font-family:var(--mono);color:var(--dim);font-weight:700}
.notes li{margin:2px 0}
.links a{font-family:var(--mono);font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--panel);display:inline-block;margin:0 6px 6px 0}
</style>
</head>

  <header>

</div>

const NSLOT=PARTS.length+1, ATOT=NSLOT*DUR+1.5;
const ease=f=>{f=Math.min(1,Math.max(0,f));return f*f*(3-2*f);};
function hinge(g,ang,off){const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),-ang); const A=new THREE.Vector3(...HX);
  g.quaternion.copy(q); g.position.copy(A).sub(A.clone().applyQuaternion(q)).add(off);}
let userCam=false; controls.addEventListener('start',()=>{userCam=true;});
function vcam(){if(userCam) return; const bb=box.clone(); bb.max.y+=20; const c=bb.getCenter(new THREE.Vector3()), sz=bb.getSize(new THREE.Vector3()), r=Math.max(sz.x,sz.y,sz.z);
  const u=ease((animT-4.6*DUR)/(1.2*DUR)), z=-0.75+1.65*u; camera.position.set(c.x-r*0.85,c.y-r*1.35,c.z+r*z); controls.target.copy(c);}
function apply(){if(animT!==null){vcam();PARTS.forEach((p,i)=>{const g=G[p.k]; if(!g) return; const f=ease((animT-i*DUR)/(DUR*0.8)), v=p.fl;
      const off=new THREE.Vector3(v[0]*(1-f),v[1]*(1-f),v[2]*(1-f)); g.visible=on[p.k]&&animT>i*DUR;
      if(p.hinge){const fo=ease((animT-(NSLOT-1)*DUR)/(DUR*0.9)); hinge(g,Math.PI*(1-fo),off);} else {g.quaternion.identity(); g.position.copy(off);}
      g.children.forEach(s=>{if(s.userData.side!==undefined) s.position.x=s.userData.side*(1-f); if(s.userData.alt) s.visible=logoOn; else if(s.userData.main&&p.alt) s.visible=!logoOn;});
      const fl=(animT-i*DUR)/(DUR*0.8); g.userData.lab.className='plab'+(fl>0&&fl<1?' new':''); g.userData.L.visible=labOn&&g.visible;}); return;}
  PARTS.forEach((p,i)=>{const g=G[p.k]; if(!g) return; g.visible=on[p.k]&&i<step; g.quaternion.identity(); g.position.set(p.ex[0]*explT,p.ex[1]*explT,p.ex[2]*explT);
    g.children.forEach(s=>{if(s.userData.side!==undefined) s.position.x=s.userData.side*explT; if(s.userData.alt) s.visible=logoOn; else if(s.userData.main&&p.alt) s.visible=!logoOn;});
    g.userData.lab.className='plab'+(i===step-1&&step<PARTS.length?' new':''); g.userData.L.visible=labOn&&g.visible;});}
function resetView(wide){const bb=box.clone(); if(expl){bb.min.z-=16; bb.max.z+=14;} if(wide){bb.max.y+=20; bb.min.z-=6;} const c=bb.getCenter(new THREE.Vector3()), sz=bb.getSize(new THREE.Vector3()), r=Math.max(sz.x,sz.y,sz.z);
  camera.position.set(c.x-r*0.9,c.y-r*1.4,c.z+r*0.9); controls.target.copy(c); controls.update();}
function resize(){const w=viewer.clientWidth,h=viewer.clientHeight; renderer.setSize(w,h,false); labelRenderer.setSize(w,h); camera.aspect=w/h; camera.fov=w<520?50:35; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(viewer); resize();
(function loop(now){requestAnimationFrame(loop); if(animT!==null){animT+=(now-animLast)/1000; animLast=now; const k=Math.min(NSLOT,Math.floor(animT/DUR)+1); if(k!==aStep){aStep=k; texts();} if(animT>ATOT){animT=null; step=PARTS.length; texts(); apply();} else apply();} if(Math.abs(explT-expl)>0.002){explT+=(expl-explT)*0.12; apply();} controls.update(); renderer.render(scene,camera); labelRenderer.render(scene,camera);})();
function hex(c){return '#'+c.toString(16).padStart(6,'0');}
function texts(){const t=TX[lang]; document.documentElement.lang=lang;
  ['ttl','tag','mat','hint'].forEach(k=>document.getElementById(k).textContent=t[k]);
  document.getElementById('btnReset').textContent=t.reset; document.getElementById('btnPlay').textContent=animT===null?t.play:t.stop; document.getElementById('btnExpl').textContent=expl?t.explOn:t.explOff;
  document.getElementById('btnLab').textContent=labOn?t.labOn:t.labOff; document.getElementById('btnAll').textContent=t.all;
  document.getElementById('hSteps').textContent=t.steps; document.getElementById('hNotes').textContent=t.notes; document.getElementById('sAll').textContent=t.allSteps;
  document.getElementById('parts').innerHTML=PARTS.map(p=>`<label class="${on[p.k]?'':'off'}"><input type="checkbox" data-k="${p.k}" ${on[p.k]?'checked':''}><span class="sw" style="background:${hex(p.c)}"></span>${p.k==='BOLTS'?t.bolts:p.k==='B4'?(lang==='ru'?'Болты RA-4':'RA-4 bolts'):p.k}${p.k==='RA-8'?' ×2':''} · ${p[lang]}</label>`).join('');
  document.getElementById('parts').insertAdjacentHTML('beforeend',`<label class="${logoOn?'':'off'}" style="border-color:#c2410c"><input type="checkbox" id="logoCb" ${logoOn?'checked':''}><span class="sw" style="background:#c2410c"></span>${t.logo}</label>`);
  document.getElementById('logoCb').onchange=e=>{logoOn=e.target.checked; try{localStorage.setItem('ra3logo',logoOn?'1':'0');}catch(x){} e.target.parentElement.classList.toggle('off',!logoOn); apply();};
  document.querySelectorAll('#parts input:not(#logoCb)').forEach(cb=>cb.onchange=()=>{on[cb.dataset.k]=cb.checked; cb.parentElement.classList.toggle('off',!cb.checked); apply();});
  const vc=document.getElementById('vcap'); vc.style.display=animT!==null?'block':'none'; if(animT!==null) vc.innerHTML='<b style="color:#c2410c">'+aStep+'/'+NSLOT+'</b> '+t.AS[aStep-1];
  if(animT!==null){document.getElementById('stepNo').textContent=(lang==='ru'?'Видео ':'Video ')+aStep+' / '+NSLOT; document.getElementById('stepTxt').textContent=t.AS[aStep-1];}
  else{document.getElementById('stepNo').textContent=(lang==='ru'?'Шаг ':'Step ')+step+' / '+PARTS.length;
  document.getElementById('stepTxt').textContent=t.S[step-1];} document.getElementById('sPrev').disabled=step<=1; document.getElementById('sNext').disabled=step>=PARTS.length;
  document.getElementById('notes').innerHTML=t.N.map(n=>`<li>${n}</li>`).join('');
  document.getElementById('links').innerHTML=`<a href="ra.html">${t.parts}</a>`;
  document.getElementById('langEn').setAttribute('aria-pressed',String(lang==='en')); document.getElementById('langRu').setAttribute('aria-pressed',String(lang==='ru'));}
document.getElementById('langEn').onclick=()=>{lang='en';try{localStorage.setItem('fr4-lang',lang)}catch(e){};texts();};
document.getElementById('langRu').onclick=()=>{lang='ru';try{localStorage.setItem('fr4-lang',lang)}catch(e){};texts();};
document.getElementById('btnReset').onclick=resetView;
document.getElementById('btnExpl').onclick=()=>{expl=expl?0:1; document.getElementById('btnExpl').setAttribute('aria-pressed',String(!!expl)); resetView(); texts();};
document.getElementById('btnLab').onclick=()=>{labOn=!labOn; apply(); texts();};
document.getElementById('btnAll').onclick=()=>{PARTS.forEach(p=>on[p.k]=true); step=PARTS.length; apply(); texts();};
document.getElementById('sPrev').onclick=()=>{if(step>1){step--; apply(); texts();}};
document.getElementById('sNext').onclick=()=>{if(step<PARTS.length){step++; apply(); texts();}};
document.getElementById('btnPlay').onclick=()=>{if(animT===null){expl=0;explT=0;userCam=false;resetView(true);animT=0;aStep=1;animLast=performance.now();step=1;}else{animT=null;step=PARTS.length;} apply(); texts();};
document.getElementById('sAll').onclick=()=>{step=PARTS.length; apply(); texts();};
texts();
const _q=new URLSearchParams(location.search); if(_q.get('embed')) document.querySelector('header').style.display='none';
fetch('drawings/MFG/RA_asm.json?v='+(_q.get('v')||'')).then(r=>r.json()).then(D=>{build(D); if(_q.get('autoplay')) document.getElementById('btnPlay').click();}).catch(e=>{viewer.insertAdjacentHTML('beforeend','<div class="hint" style="top:10px">3D data failed to load</div>');});
</script>
