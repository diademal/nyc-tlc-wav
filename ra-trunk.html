<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramp in the Trunk · Sienna WAV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e9edf0; --panel:#f6f8f9; --ink:#1b2126; --muted:#5b6670; --line:#c9d1d7;
  --steel:#8f9aa4; --plate:#a9b3bb; --dim:#c2410c; --dim-bg:#fff4ec; --focus:#0b6bcb;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171b; --panel:#1a2126; --ink:#e3e8ec; --muted:#95a1ab; --line:#2c353c;
    --steel:#7d8993; --plate:#95a1ab; --dim:#ff8a4c; --dim-bg:#2a1a10; --focus:#6cb4ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171b; --panel:#1a2126; --ink:#e3e8ec; --muted:#95a1ab; --line:#2c353c;
  --steel:#7d8993; --plate:#95a1ab; --dim:#ff8a4c; --dim-bg:#2a1a10; --focus:#6cb4ff; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding:12px 16px 28px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.viewer{position:relative;height:min(68vh,640px);min-height:360px;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,var(--panel),var(--bg))}
#c3d,#labels{position:absolute;inset:0}
#c3d{width:100%;height:100%;display:block;touch-action:none}
#labels{pointer-events:none}
.dim{font-family:var(--mono);font-size:calc(12px * var(--ds,1));font-weight:500;color:var(--dim);background:var(--dim-bg);border:1px solid var(--dim);
  padding:1px 5px;border-radius:3px;white-space:nowrap;line-height:1.3}
.dim.note{color:var(--ink);border-color:var(--line);background:var(--panel)}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.bar button,.bar label{font-family:var(--font);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:4px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bar button:hover,.bar label:hover{border-color:var(--muted)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar input{accent-color:var(--dim);margin:0}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.spec section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.spec h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.spec dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0}
.spec dt{color:var(--ink)}
.spec dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--dim)}
.spec .dist{grid-column:1/-1}
.spec .dist dl{grid-template-columns:repeat(auto-fill,minmax(150px,auto) minmax(110px,auto));column-gap:24px}
.distnote{margin:0 0 8px;font-size:13px;color:var(--muted)}
.spec .dist dd{white-space:nowrap}
.pick{cursor:pointer;border-radius:3px}
.pick:hover,.pick:focus-visible{background:var(--dim-bg);outline:none}
.pick.on{background:var(--dim-bg);box-shadow:inset 3px 0 0 #1a73e8}
.dim.hl{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:600;font-size:14px;padding:3px 8px;pointer-events:auto;cursor:pointer;z-index:5}
.nodims .dim:not(.hl){display:none!important}
.err{padding:20px;color:var(--ink)}
header{position:relative}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;order:3;margin-left:auto}
.lang button{font-family:var(--mono);font-size:13px;border:0;background:var(--panel);color:var(--muted);padding:5px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--dim);color:var(--panel)}
.lang button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
@media (max-width:520px){.dim{font-size:calc(10.5px * var(--ds,1));padding:0 4px}}
#btnDims[aria-pressed="false"]{border-color:var(--dim);color:var(--dim)}
</style>
<style>
.lang button,.mode button{font-family:var(--mono);font-size:13px;padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"],.mode button[aria-pressed="true"]{background:var(--dim);border-color:var(--dim);color:var(--panel)}
.matbox{border:2px solid var(--dim);background:var(--dim-bg);color:var(--dim);border-radius:6px;padding:8px 12px;font-weight:700}
.pt{font-family:var(--mono);font-size:15px;font-weight:700;color:#c62828;text-shadow:0 0 3px var(--panel),0 0 3px var(--panel)}
.links a{font-family:var(--mono);font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--panel);display:inline-block;margin:0 6px 6px 0}
.links a:hover{border-color:var(--dim)}
</style>
<style>
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts label{font-family:var(--font);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.parts label.off{opacity:.55}
.sw{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.35);display:inline-block}
.plab{font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;background:#2f3b45;border-radius:3px;padding:1px 6px;white-space:nowrap}
.plab.new{background:#c2410c}
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.steps button{font-family:var(--mono);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer}
.steps button:disabled{opacity:.4;cursor:default}
#stepTxt{font-size:15px}
#stepNo{font-family:var(--mono);color:var(--dim);font-weight:700}
.notes li{margin:2px 0}
.links a{font-family:var(--mono);font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--panel);display:inline-block;margin:0 6px 6px 0}
</style>
<style>
.player{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.player button{font-family:var(--font);font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:7px 14px;cursor:pointer;min-width:44px}
.player button[aria-pressed="true"]{background:var(--dim);border-color:var(--dim);color:var(--panel)}
.player input[type=range]{flex:1 1 220px;accent-color:var(--dim);min-width:160px}
#deg{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--dim);min-width:64px;text-align:right}
.spd{display:inline-flex;gap:4px}
.spd button{min-width:auto;padding:6px 9px;font-family:var(--mono);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl"></h1>
    <div class="lang" role="group" aria-label="Language"><button type="button" id="langEn">EN</button><button type="button" id="langRu">RU</button></div>
    <span class="tag" id="tag"></span>
  </header>
  <div class="matbox" id="mat"></div>
  <div class="viewer" id="viewer"><canvas id="c3d"></canvas><div id="labels"></div><div class="hint" id="hint"></div></div>
  <div class="player" role="group" aria-label="Player">
    <button id="bPlay" type="button" aria-pressed="false">▶</button>
    <button id="b0" type="button"></button>
    <input id="ph" type="range" min="0" max="1000" step="1" value="0" aria-label="Opening">
    <button id="b1" type="button"></button>
    <span id="deg">0%</span>
    <span class="spd" id="spd"></span>
  </div>
  <p id="phase" style="margin:0;font-weight:600"></p>
  <div class="bar" role="group" aria-label="View">
    <button id="btnReset" type="button"></button>
    <button id="btnSide" type="button"></button>
    <button id="btnBack" type="button"></button>
    <button id="btnLab" type="button" aria-pressed="true"></button>
  </div>
  <div class="parts" id="parts" role="group" aria-label="Parts"></div>
  <div class="spec">
    <section><h2 id="hInfo"></h2><ul class="notes" id="info"></ul></section>
    <section><h2 id="hLinks"></h2><div class="links" id="links"></div></section>
  </div>
</div>
<script src="vendor/three-bundle.js"></script>
<script>
// Car frame (inches): X across (0 = centre), Y forward (0 = rear opening, street at Y<0), Z up from the ground.
const H=10;           // threshold / lowered floor height at the opening (DRAFT)
const OPW=49, OPT=46; // opening width, opening top above ground (DRAFT, Sienna liftgate opening ~49 x 36)
const TIP=90+Math.asin(H/44.6)*180/Math.PI;   // block tip so the ramp end touches the ground
// RA75 assembly -> car: X=-x+17, Y=z+4.125, Z=y+H+0.375 (block stands up, RA-1/RA-2 inside, RA-7 / RA-3 to the street)
const M=new THREE.Matrix4().set(-1,0,0,17, 0,0,1,4.125, 0,1,0,H+0.375, 0,0,0,1);
const HA={y:22.0,z:1.21875};   // RA-1/RA-2 hinge axis in RA75 assembly coords (along x)
const PARTS=[
 {k:'BODY',c:0xc9d3dc,ru:'Кузов (черновик)',en:'Body (draft)'},
 {k:'GATE',c:0x8fa2b3,ru:'Задняя дверь',en:'Liftgate'},
 {k:'RA-7',ids:['RA7'],c:0xb9c2ca,ru:'Короб — к улице',en:'Box — street side'},
 {k:'RA-3',ids:['RA3'],c:0x8fb4d6,ru:'Плита',en:'Plate'},
 {k:'RA-5',ids:['RA5'],c:0x7cc48a,ru:'Уголок с усами',en:'Angle'},
 {k:'RA-2',ids:['T_RA2'],c:0xd2b27a,ru:'Рампа (неподвижная)',en:'Ramp (fixed half)'},
 {k:'RA-1',ids:['T_RA1'],c:0x9aa3ab,hinge:true,ru:'Рампа (раскладывается)',en:'Ramp (unfolding half)'},
 {k:'BOLTS',ids:['T_Bolt1','T_Spacer1','T_Bolt2','T_Spacer2'],c:0x3a3f45,ru:'Болты шарнира',en:'Hinge bolts'}];
const TX={ru:{ttl:'Рампа в багажнике Sienna — плеер открытия',tag:'Sienna WAV · дюймы · кузов — черновик по заводским размерам',
  mat:'Рампа: алюминий 5052-H32 · t = 0.125″',hint:'Мышь/палец: вращать, колесо/два пальца: приблизить',
  start:'Закрыто',end:'Открыто',reset:'Сбросить вид',side:'Вид сбоку',back:'Вид сзади',labOn:'Скрыть названия',labOff:'Показать названия',info:'Как работает',links:'Ссылки',
  P:['Закрыто: блок рампы стоит вертикально в проёме, RA-1 и RA-2 внутри, RA-7 к улице.','1. Поднимается задняя дверь.','2. Блок рампы откидывается наружу (ось внизу, у порога).','3. RA-1 раскладывается на шарнире на 180° — рампа до земли.','Открыто: рампа лежит от порога до земли.'],
  I:['Весь собранный блок RA стоит вертикально в проёме: RA-1 и RA-2 со стороны салона, RA-7 со стороны улицы.','Ось откидывания блока — внизу, у порога (положение оси пока условное).',
     'Кузов — черновик: проём ≈ 49″ шир., порог ≈ 10″ от земли — поправим по замерам машины.','Шарнир RA-1/RA-2 — как в блоке 1+2, 0…180°.'],
  asm:'Сборка рампы 3D',hinge:'Шарнир 1+2',parts:'Все детали рампы'},
 en:{ttl:'Ramp in the Sienna trunk — opening player',tag:'Sienna WAV · inches · body is a draft from factory dimensions',
  mat:'Ramp: aluminum 5052-H32 · t = 0.125″',hint:'Drag to rotate, wheel / pinch to zoom',
  start:'Closed',end:'Open',reset:'Reset view',side:'Side view',back:'Rear view',labOn:'Hide names',labOff:'Show names',info:'How it works',links:'Links',
  P:['Closed: the ramp block stands upright in the opening, RA-1 and RA-2 inside, RA-7 to the street.','1. The liftgate goes up.','2. The ramp block tips out (pivot at the bottom, at the sill).','3. RA-1 unfolds 180° on the hinge — ramp to the ground.','Open: the ramp lies from the sill to the ground.'],
  I:['The whole assembled RA block stands upright in the opening: RA-1 and RA-2 face the cabin, RA-7 faces the street.','The block tips out about a pivot at the bottom, at the sill (pivot location is provisional).',
     'Body is a draft: opening ≈ 49″ wide, sill ≈ 10″ above the ground — to be corrected from measurements.','RA-1/RA-2 hinge as in the 1+2 block, 0…180°.'],
  asm:'Ramp assembly 3D',hinge:'Hinge 1+2',parts:'All ramp parts'}};
let lang='en';try{lang=localStorage.getItem('fr4-lang')||'en';}catch(e){}
let labOn=true, ph=0, playing=false, dir=1, speed=1; const on={}; PARTS.forEach(p=>on[p.k]=true);
const viewer=document.getElementById('viewer'), canvas=document.getElementById('c3d'), labelsEl=document.getElementById('labels');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(35,1,0.5,3000); camera.up.set(0,0,1);
const controls=new THREE.TrackballControls(camera,canvas); controls.rotateSpeed=3; controls.zoomSpeed=1.2; controls.panSpeed=0.8; controls.dynamicDampingFactor=0.15;
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,0.85)); const sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(-60,-90,120); scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.35); fill.position.set(60,60,40); scene.add(fill);
const labelRenderer=new THREE.CSS2DRenderer(); labelRenderer.domElement.style.position='absolute'; labelRenderer.domElement.style.inset='0'; labelsEl.appendChild(labelRenderer.domElement);
const edgeMat=new THREE.LineBasicMaterial({color:0x2a3138});
const G={}, LBL={};
function lab(txt,pos,parent){const d=document.createElement('div'); d.className='plab'; d.textContent=txt; const L=new THREE.CSS2DObject(d); L.position.copy(pos); parent.add(L); return L;}
function boxM(x0,x1,y0,y1,z0,z1,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),mat); m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); return m;}
// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),new THREE.MeshStandardMaterial({color:0x8a9096,roughness:1,transparent:true,opacity:0.35})); ground.position.set(0,0,-0.05); scene.add(ground);
// body (draft)
const bodyMat=new THREE.MeshStandardMaterial({color:0xc9d3dc,metalness:0.1,roughness:0.6,transparent:true,opacity:0.32,side:THREE.DoubleSide,depthWrite:false});
const body=new THREE.Group(); const W2=OPW/2, IW=25.5, OW=39;
body.add(boxM(-IW,IW,0,80,H-1,H,bodyMat));                      // lowered floor
body.add(boxM(-OW,-IW,0,80,H,OPT+6,bodyMat)); body.add(boxM(IW,OW,0,80,H,OPT+6,bodyMat));   // sides
body.add(boxM(-OW,OW,0,80,OPT+6,OPT+8,bodyMat));               // roof
body.add(boxM(-OW,-W2,-3,0,H,OPT,bodyMat)); body.add(boxM(W2,OW,-3,0,H,OPT,bodyMat));        // pillars around the opening
body.add(boxM(-OW,OW,-3,0,OPT,OPT+8,bodyMat));                 // header
body.add(boxM(-OW,-IW,-4,80,6,H,bodyMat)); body.add(boxM(IW,OW,-4,80,6,H,bodyMat));          // rocker / bumper sides
const tyre=new THREE.MeshStandardMaterial({color:0x2b2f33,roughness:0.9});
[-1,1].forEach(s=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(14,14,9,32),tyre); w.rotation.z=Math.PI/2; w.position.set(s*(OW-4),36,14); body.add(w);});
scene.add(body); G['BODY']=body; LBL['BODY']=lab('Sienna',new THREE.Vector3(-OW,60,OPT+9),body);
// liftgate, hinged at the roof rear edge
const gatePiv=new THREE.Group(); gatePiv.position.set(0,0,OPT+7); scene.add(gatePiv);
const gateMat=new THREE.MeshStandardMaterial({color:0x8fa2b3,metalness:0.2,roughness:0.5,transparent:true,opacity:0.55,side:THREE.DoubleSide});
const gate=new THREE.Group(); gate.add(boxM(-W2-4,W2+4,-5,-3,H+2-(OPT+7),0,gateMat)); gatePiv.add(gate); G['GATE']=gate; LBL['GATE']=lab('Liftgate',new THREE.Vector3(0,-5,(H+2-(OPT+7))/2),gate);
// ramp block: pivot at the bottom outer edge (Y=1, Z=H), assembly mapped with M
const tipPiv=new THREE.Group(); tipPiv.position.set(0,1,H); scene.add(tipPiv);
const blk=new THREE.Group(); blk.matrixAutoUpdate=false; blk.matrix.copy(new THREE.Matrix4().makeTranslation(0,-1,-H).multiply(M)); tipPiv.add(blk);
const hinge=new THREE.Group(); hinge.position.set(0,HA.y,HA.z); blk.add(hinge);
function build(D){const byId={}; D.forEach(r=>byId[r.id]=r);
  PARTS.filter(p=>p.ids).forEach(p=>{const g=new THREE.Group(); const mat=new THREE.MeshStandardMaterial({color:p.c,metalness:0.35,roughness:0.5,side:THREE.DoubleSide});
    p.ids.forEach(id=>{const r=byId[id]; if(!r) return; const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(r.V.flat(),3)); geo.setIndex(r.F.flat()); geo.computeVertexNormals();
      g.add(new THREE.Mesh(geo,mat)); r.E.forEach(e=>{const lg=new THREE.BufferGeometry().setFromPoints(e.map(q=>new THREE.Vector3(q[0],q[1],q[2]))); g.add(new THREE.Line(lg,edgeMat));});});
    const b=new THREE.Box3().setFromObject(g), c=b.getCenter(new THREE.Vector3());
    if(p.hinge){g.position.set(0,-HA.y,-HA.z); hinge.add(g);} else blk.add(g);
    G[p.k]=g; if(p.k!=='BOLTS') LBL[p.k]=lab(p.k,new THREE.Vector3(p.k==='RA-7'?c.x:b.max.x-3,c.y,p.k==='RA-3'?b.min.z:p.k==='RA-7'?b.min.z+1:b.max.z),g);});
  resetView(); apply();}
function sm(t){t=Math.min(1,Math.max(0,t)); return t*t*(3-2*t);}
function apply(){const a=sm(ph/0.3), b=sm((ph-0.33)/0.32), c=sm((ph-0.68)/0.32);
  gatePiv.rotation.x=-a*100*Math.PI/180; tipPiv.rotation.x=b*TIP*Math.PI/180; hinge.rotation.x=-c*Math.PI;
  PARTS.forEach(p=>{const g=G[p.k]; if(!g) return; g.visible=on[p.k]; if(LBL[p.k]) LBL[p.k].visible=labOn&&on[p.k];});
  document.getElementById('deg').textContent=Math.round(ph*100)+'%'; document.getElementById('ph').value=Math.round(ph*1000);
  const t=TX[lang].P; document.getElementById('phase').textContent=ph<=0.001?t[0]:ph<0.33?t[1]:ph<0.68?t[2]:ph<0.999?t[3]:t[4];}
function view(px,py,pz,tx,ty,tz){camera.position.set(px,py,pz); camera.up.set(0,0,1); controls.target.set(tx,ty,tz); controls.update();}
function resetView(){view(-95,-120,85,0,10,22);}
function resize(){const w=viewer.clientWidth,h=viewer.clientHeight; renderer.setSize(w,h,false); labelRenderer.setSize(w,h); camera.aspect=w/h; camera.fov=w<520?50:35; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(viewer); resize();
let last=performance.now();
(function loop(t){requestAnimationFrame(loop); const dt=Math.min(0.1,(t-last)/1000); last=t;
  if(playing){ph+=dir*0.12*speed*dt; if(ph>=1){ph=1;dir=-1;setPlay(false);} if(ph<=0){ph=0;dir=1;setPlay(false);} apply();}
  controls.update(); renderer.render(scene,camera); labelRenderer.render(scene,camera);})(last);
function setPlay(v){playing=v; const b=document.getElementById('bPlay'); b.textContent=v?'❚❚':'▶'; b.setAttribute('aria-pressed',String(v));}
function hex(c){return '#'+c.toString(16).padStart(6,'0');}
function texts(){const t=TX[lang]; document.documentElement.lang=lang;
  ['ttl','tag','mat','hint'].forEach(k=>document.getElementById(k).textContent=t[k]);
  document.getElementById('b0').textContent=t.start; document.getElementById('b1').textContent=t.end;
  document.getElementById('btnReset').textContent=t.reset; document.getElementById('btnSide').textContent=t.side; document.getElementById('btnBack').textContent=t.back;
  document.getElementById('btnLab').textContent=labOn?t.labOn:t.labOff;
  document.getElementById('hInfo').textContent=t.info; document.getElementById('hLinks').textContent=t.links;
  document.getElementById('info').innerHTML=t.I.map(n=>`<li>${n}</li>`).join('');
  document.getElementById('links').innerHTML=`<a href="ra-asm.html">${t.asm}</a><a href="ra-hinge.html">${t.hinge}</a><a href="ra.html">${t.parts}</a>`;
  document.getElementById('parts').innerHTML=PARTS.map(p=>`<label class="${on[p.k]?'':'off'}"><input type="checkbox" data-k="${p.k}" ${on[p.k]?'checked':''}><span class="sw" style="background:${hex(p.c)}"></span>${p[lang]}${p.ids&&p.k!=='BOLTS'?' · '+p.k:''}</label>`).join('');
  document.querySelectorAll('#parts input').forEach(cb=>cb.onchange=()=>{on[cb.dataset.k]=cb.checked; cb.parentElement.classList.toggle('off',!cb.checked); apply();});
  document.getElementById('spd').innerHTML=[0.5,1,2].map(v=>`<button type="button" data-s="${v}" aria-pressed="${v===speed}">${v}×</button>`).join('');
  document.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s; texts();});
  document.getElementById('langEn').setAttribute('aria-pressed',String(lang==='en')); document.getElementById('langRu').setAttribute('aria-pressed',String(lang==='ru')); apply();}
document.getElementById('langEn').onclick=()=>{lang='en';try{localStorage.setItem('fr4-lang',lang)}catch(e){};texts();};
document.getElementById('langRu').onclick=()=>{lang='ru';try{localStorage.setItem('fr4-lang',lang)}catch(e){};texts();};
document.getElementById('bPlay').onclick=()=>{if(!playing){dir=ph>=1?-1:(ph<=0?1:dir);} setPlay(!playing);};
document.getElementById('b0').onclick=()=>{setPlay(false); ph=0; apply();};
document.getElementById('b1').onclick=()=>{setPlay(false); ph=1; apply();};
document.getElementById('ph').oninput=e=>{setPlay(false); ph=e.target.value/1000; apply();};
document.getElementById('btnReset').onclick=resetView;
document.getElementById('btnSide').onclick=()=>view(-200,5,25,0,5,22);
document.getElementById('btnBack').onclick=()=>view(0,-170,40,0,10,25);
document.getElementById('btnLab').onclick=()=>{labOn=!labOn; apply(); texts();};
texts();
fetch('drawings/MFG/RA_asm.json').then(r=>r.json()).then(build).catch(e=>{viewer.insertAdjacentHTML('beforeend','<div class="hint" style="top:10px">3D data failed to load</div>');});
</script>
</body>
</html>
