<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramp assembly video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e9edf0;--panel:#f6f8f9;--ink:#1b2126;--muted:#5b6670;--line:#c9d1d7;--accent:#c2410c;--accent-bg:#fff4ec;--bend:#0b6bcb;
  --font:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--accent:#ff8a4c;--accent-bg:#2a1a10;--bend:#6cb4ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171b;--panel:#1a2126;--ink:#e3e8ec;--muted:#95a1ab;--line:#2c353c;--accent:#ff8a4c;--accent-bg:#2a1a10;--bend:#6cb4ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{padding:10px 16px 20px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-size:22px;margin:0;font-weight:700}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lang{margin-left:auto;display:flex}
.lang button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;cursor:pointer}
.lang button:first-child{border-radius:4px 0 0 4px}.lang button:last-child{border-radius:0 4px 4px 0;border-left:0}
.lang button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.viewer{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:4/3;min-height:280px}
canvas{display:block;width:100%;height:100%;touch-action:none}
.cap{position:absolute;left:10px;right:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:15px}
.cap b{color:var(--accent);font-family:var(--mono)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer;min-height:36px}
.ctl button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ctl input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.ctl .t{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:64px;text-align:right}
ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ol li{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;font-size:14px;display:flex;gap:8px}
ol li .n{font-family:var(--mono);color:var(--muted);min-width:18px}
ol li:hover{border-color:var(--accent)}
ol li.on{border-color:var(--accent);background:var(--accent-bg)}
ol li.on .n{color:var(--accent);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.plab{font:600 12px/1 var(--mono);background:#26313a;color:#fff;padding:3px 6px;border-radius:3px;white-space:nowrap}.plab.new{background:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-height:36px;cursor:pointer}.chk input{accent-color:var(--accent);margin:0}
.err{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="ttl">…</h1><span class="tag" id="tag"></span>
    <div class="lang" role="group" aria-label="Language"><button type="button" id="langEn">EN</button><button type="button" id="langRu">RU</button></div></header>
  <div class="main">
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <div class="viewer" id="viewer"><canvas id="c3d"></canvas><div id="labels" style="position:absolute;inset:0;pointer-events:none"></div><div class="cap" id="cap"></div></div>
      <div class="ctl">
        <button type="button" id="prev" aria-label="Previous step">◀</button>
        <button type="button" class="pri" id="play">▶</button>
        <button type="button" id="next" aria-label="Next step">▶|</button>
        <input type="range" id="slider" min="0" max="1000" value="0" aria-label="Timeline">
        <span class="t" id="tm"></span>
        <button type="button" id="rec"></button>
        <label class="chk"><span id="logoTxt"></span> <select id="logoSel"><option value="RA3">RA-3</option><option value="RA3L">RA-3L</option><option value="RA3A">RA-3A</option><option value="RA3B">RA-3B</option></select></label>
        <label class="chk"><input type="checkbox" id="namesCb"><span id="namesTxt"></span></label>
        <label class="chk"><input type="checkbox" id="centerCb" checked><span id="centerTxt"></span></label>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px"><ol id="steps"></ol><div class="note" id="note"></div></div>
  </div>
</div>
<div id="matBadge" style="position:fixed;right:10px;bottom:10px;z-index:50;max-width:calc(100vw - 20px);font:600 12px/1.35 'IBM Plex Sans Condensed',Arial,sans-serif;color:#c2410c;background:#fff4ec;border:1.5px solid #c2410c;border-radius:6px;padding:5px 9px;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none"></div>
<script src="vendor/three-bundle.js"></script>
<script>
const PARTS=[
 {k:'RA7',ids:['RA7'],c:0xb9c2ca,fl:[0,0,10],lab:'RA-7',la:[1.02,0.35,0.5]},
 {k:'RA4',ids:['RA4'],c:0xd98a4e,fl:[0,0,-12],lab:'RA-4',la:[0.5,0.0,0.3]},
 {k:'B4',gen:'b4',c:0x2f3a44,fl:[0,0,6],lab:''},
 {k:'RA5',ids:['RA5'],c:0x7cc48a,fl:[0,0,-12],lab:'RA-5',la:[0.8,0.7,0.1]},
 {k:'RA3',ids:['RA3'],alt:['RA3L','RA3A','RA3B'],c:0x8fb4d6,fl:[0,0,0],lab:'RA-3',la:[-0.02,0.4,0.1],sub3:true},
 {k:'RA9',ids:['RA9'],c:0xe3e7ea,fl:[0,0,6],lab:'RA-9',la:[0.5,0.5,0.0],sub3:true},
 {k:'B9',gen:'b9',c:0x2f3a44,fl:[0,0,-8],lab:'',sub3:true},
 {k:'RA8',ids:['RA8a','RA8b'],c:0xc9b24a,fl:[0,0,-10],lab:'RA-8',la:[1.0,0.5,0.0],side:6},
 {k:'B8',gen:'b8',c:0x2f3a44,fl:[0,0,-6],lab:''},
 {k:'RA2',ids:['T_RA2'],c:0xd2b27a,fl:[0,0,12],lab:'RA-2',la:[0.2,1.02,0.6]},
 {k:'RA1',ids:['T_RA1'],c:0x9aa3ab,fl:[0,0,12],lab:'RA-1',la:[0.7,0.6,1.0],hinge:true},
 {k:'HB',ids:['T_Bolt1','T_Spacer1','T_Bolt2','T_Spacer2'],c:0x3a3f45,fl:[0,0,0],side:5,lab:''}];
const HX=[0,22.0,1.21875];                       // RA-1 / RA-2 hinge axis (along X), inches
const B4=[[2.25,0.75],[3.75,0.75],[30.25,0.75],[31.75,0.75]];
const B8=[[-0.375,13.5],[-0.375,17.125],[34.375,13.5],[34.375,17.125]];
const B9=[[6.873,4.253],[27.123,4.253]];   // RA-9 -> RA-3 bolts 8 mm (RA-3 plate z -3.125..-3.0, RA-9 -3.0..-2.952)
const LIFT=14;   // RA-3 + RA-9 are assembled 14 in below the box, then go up together   // RA-8 flange bolts 8 mm through RA-3 (z -3.125 .. -3.25)
// timeline: [duration, part index | 'fold']
const SEQ=[[1.8,0],[2.2,1],[1.6,2],[2.2,3],[1.6,4],[2.2,5],[1.4,6],[2.2,'lift'],[2.0,7],[1.6,8],[2.2,9],[2.2,10],[1.6,11],[2.8,'fold']];
const LIFT_I=SEQ.findIndex(x=>x[1]==='lift');
const START=[];let acc=0;for(const s of SEQ){START.push(acc);acc+=s[0];} const TOTAL=acc+1.2;
const TX={en:{ttl:'Ramp — assembly video',tag:'Sienna WAV · RA-7 → RA-4 → RA-5 → RA-3 → RA-9 → RA-8 → RA-2 → RA-1',play:'▶ Play',logo:'RA-3 version',names:'Part names',center:'Keep centred',pause:'❚❚ Pause',rec:'● Record video',recing:'● Recording…',
  note:'Mouse: rotate, wheel: zoom. Click a step to jump to it. “Record video” saves an .mp4 clip.',
  steps:['RA-7 — the box: plate on top, side walls with lips, front wall.','RA-4 goes into RA-7 at the back edge: 2⅛ side with 6 squares against the plate on the back hole row, 2¼ side at the bottom pointing in.',
   'RA-4 is bolted to RA-7 — 4 × 8 mm bolts (2¼, 3¾, 30¼, 31¾).','RA-5 goes into RA-7: fork tab down, 2¾ side up against the plate, whiskers to the front wall.',
   'RA-3 is prepared below the box: ears and flange up, ears at the back.','RA-9 stainless plate (18 ga, 21½ × 8¾) goes onto the inner face of RA-3 over the logo cut.','RA-9 is bolted to RA-3 — the two 8 mm bolts below the name.','RA-3 with RA-9 goes up under the RA-7 side lips.','RA-8 brackets (2, the right one mirrored) on the RA-3 ends: flange on the two 8 mm holes of the flange side, plate against the end, arc away from the ears.','RA-8 bolted to RA-3 — 2 × 8 mm bolts each.','RA-2 lies on RA-7, its 6-hole edge on the back hole row.',
   'RA-1 joins RA-2 opened (180°) — the hinge ears line up.','Hinge bolts 3/8 + spacers go through the RA-1 and RA-2 ears.','RA-1 folds over onto RA-2 — the ramp is assembled.'],
  badge:'Material: <b>Aluminum 5052-H32</b> · <b>t = 0.125″ (3.18 mm)</b>'},
 ru:{ttl:'Рампа — видео сборки',tag:'Sienna WAV · RA-7 → RA-4 → RA-5 → RA-3 → RA-9 → RA-8 → RA-2 → RA-1',play:'▶ Пуск',logo:'Вариант RA-3',names:'Названия деталей',center:'Держать по центру',pause:'❚❚ Пауза',rec:'● Записать видео',recing:'● Идёт запись…',
  note:'Мышь: вращать, колесо: приблизить. Нажмите на шаг, чтобы перейти к нему. «Записать видео» сохраняет ролик .mp4.',
  steps:['RA-7 — короб: дно сверху, боковины с бортиками, передняя стенка.','RA-4 заходит внутрь RA-7 у заднего края: сторона 2⅛ с 6 квадратами к дну на задний ряд дырок, сторона 2¼ внизу смотрит внутрь.',
   'RA-4 крепится к RA-7 — 4 болта 8 мм (2¼, 3¾, 30¼, 31¾).','RA-5 заходит внутрь RA-7: рогатка внизу, сторона 2¾ вверх к дну, усы к передней стенке.',
   'RA-3 готовится под коробом: уши и отгиб вверх, уши сзади.','RA-9 — нержавейка (18 ga, 21½ × 8¾) ложится изнутри на RA-3 поверх выреза.','RA-9 прикручивается к RA-3 — два болта 8 мм под названием.','RA-3 вместе с RA-9 поднимается под бортики RA-7.','RA-8 (2 шт, правый зеркальный) на торцы RA-3: фланец на две дырки 8 мм со стороны бортика, пластина прижата к торцу, полукруг от ушей.','RA-8 крепится к RA-3 — по 2 болта 8 мм.','RA-2 ложится на RA-7, край с 6 дырками на задний ряд дырок.',
   'RA-1 подходит к RA-2 в открытом виде (180°) — уши шарнира совпадают.','Болты шарнира 3/8 + втулки через уши RA-1 и RA-2.','RA-1 складывается на RA-2 — рампа собрана.'],
  badge:'Металл: <b>алюминий 5052-H32</b> · <b>t = 0.125″ (3.18 мм)</b>'}};
let lang='en';try{lang=localStorage.getItem('fr4-lang')||'en';}catch(e){}
let ra3v='RA3'; try{ra3v=localStorage.getItem('ra3var')||(localStorage.getItem('ra3logo')==='1'?'RA3L':'RA3');}catch(e){} if(!['RA3','RA3L','RA3A','RA3B'].includes(ra3v)) ra3v='RA3';
let namesOn=false, centerOn=true; try{namesOn=localStorage.getItem('ra-names')==='1'; centerOn=localStorage.getItem('ra-center')!=='0';}catch(e){}
const viewer=document.getElementById('viewer'), canvas=document.getElementById('c3d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true}); renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(34,1,0.05,2000); camera.up.set(0,0,1);
const controls=new THREE.TrackballControls(camera,canvas); controls.rotateSpeed=3; controls.zoomSpeed=1.2; controls.panSpeed=0.8; controls.dynamicDampingFactor=0.15;
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,0.85)); const sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(-20,-30,40); scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.45); fill.position.set(20,15,-30); scene.add(fill);
const labelRenderer=new THREE.CSS2DRenderer(); labelRenderer.domElement.style.position='absolute'; labelRenderer.domElement.style.inset='0'; document.getElementById('labels').appendChild(labelRenderer.domElement);
const edgeMat=new THREE.LineBasicMaterial({color:0x2a3138});
const G=[]; let box=new THREE.Box3(), ready=false;
const ease=f=>{f=Math.min(1,Math.max(0,f));return f*f*(3-2*f);};
function build(D){const byId={}; D.forEach(r=>byId[r.id]=r);
  PARTS.forEach(p=>{const g=new THREE.Group(); const mat=new THREE.MeshStandardMaterial({color:p.c,metalness:0.35,roughness:0.5,side:THREE.DoubleSide});
    if(p.gen==='b9'){B9.forEach(([x,y])=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.155,0.7,20),mat);a.rotation.x=Math.PI/2;a.position.set(x,y,-3.05);g.add(a);
      const h=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.15,24),mat);h.rotation.x=Math.PI/2;h.position.set(x,y,-3.2);g.add(h);
      const n=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.25,6),mat);n.rotation.x=Math.PI/2;n.position.set(x,y,-2.8);g.add(n);});}
    if(p.gen==='b8'){B8.forEach(([x,y])=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.155,0.9,20),mat);a.rotation.x=Math.PI/2;a.position.set(x,y,-3.2);g.add(a);
      const h=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.17,24),mat);h.rotation.x=Math.PI/2;h.position.set(x,y,-3.04);g.add(h);
      const n=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.27,6),mat);n.rotation.x=Math.PI/2;n.position.set(x,y,-3.39);g.add(n);});}
    (p.alt||[]).forEach(id=>{const r=byId[id]; if(!r) return; const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(r.V.flat(),3)); geo.setIndex(r.F.flat()); geo.computeVertexNormals();
      const sub=new THREE.Group(); sub.add(new THREE.Mesh(geo,mat)); r.E.forEach(e=>sub.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(e.map(q=>new THREE.Vector3(q[0],q[1],q[2]))),edgeMat))); sub.userData.alt=true; sub.userData.altId=id; g.add(sub);});
    if(p.gen==='b4'){B4.forEach(([x,y])=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.155,1.0,20),mat);a.rotation.x=Math.PI/2;a.position.set(x,y,-0.05);g.add(a);
      const h=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.17,24),mat);h.rotation.x=Math.PI/2;h.position.set(x,y,0.215);g.add(h);
      const n=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.27,6),mat);n.rotation.x=Math.PI/2;n.position.set(x,y,-0.39);g.add(n);});}
    (p.ids||[]).forEach(id=>{const r=byId[id]; if(!r) return; const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(r.V.flat(),3)); geo.setIndex(r.F.flat()); geo.computeVertexNormals();
      const sub=new THREE.Group(); sub.add(new THREE.Mesh(geo,mat)); r.E.forEach(e=>sub.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(e.map(q=>new THREE.Vector3(q[0],q[1],q[2]))),edgeMat)));
      if(p.side){const cx=r.V.reduce((s,v)=>s+v[0],0)/r.V.length; sub.userData.side=cx>17?p.side:-p.side;} sub.userData.main=true; g.add(sub);});
    if(p.lab){const b=new THREE.Box3().setFromObject(g),la=p.la; const d=document.createElement('div'); d.className='plab'; d.textContent=p.lab; const L=new THREE.CSS2DObject(d);
      L.position.set(b.min.x+(b.max.x-b.min.x)*la[0],b.min.y+(b.max.y-b.min.y)*la[1],b.min.z+(b.max.z-b.min.z)*la[2]); g.add(L); g.userData.d=d; g.userData.L=L;}
    scene.add(g); G.push(g); box.expandByObject(g);});
  ready=true; setT(T0);}
let userCam=false; controls.addEventListener('start',()=>{userCam=true; if(centerOn){centerOn=false; document.getElementById('centerCb').checked=false; try{localStorage.setItem('ra-center','0');}catch(e){}}});
function camAt(t){const bb=box.clone(); bb.max.y+=20; const c=bb.getCenter(new THREE.Vector3()), sz=bb.getSize(new THREE.Vector3()), r=Math.max(sz.x,sz.y,sz.z);
  const u=ease((t-START[10])/SEQ[10][0]), z=-0.75+1.65*u; camera.position.set(c.x-r*1.0,c.y-r*1.55,c.z+r*z*1.1); controls.target.copy(c);}
let cur=-1;
function setT(t){ if(ready){
  PARTS.forEach((p,i)=>{const g=G[i]; const si=SEQ.findIndex(s=>s[1]===i); const f=ease((t-START[si])/(SEQ[si][0]*0.85)); g.visible=t>START[si]+1e-6||si===0;
    const off=new THREE.Vector3(p.fl[0]*(1-f),p.fl[1]*(1-f),p.fl[2]*(1-f));
    if(p.sub3){const lf=ease((t-START[LIFT_I])/SEQ[LIFT_I][0]); off.z-=LIFT*(1-lf);}
    if(p.hinge){const fo=ease((t-START[13])/SEQ[13][0]); const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI*(1-fo)); const A=new THREE.Vector3(...HX);
      g.quaternion.copy(q); g.position.copy(A).sub(A.clone().applyQuaternion(q)).add(off);} else g.position.copy(off);
    g.children.forEach(s=>{if(s.userData.side!==undefined) s.position.x=s.userData.side*(1-f); if(s.userData.alt) s.visible=(s.userData.altId===ra3v); else if(s.userData.main&&p.alt) s.visible=(ra3v==='RA3');});
    if(g.userData.d){const fl=(t-START[si])/SEQ[si][0]; g.userData.d.className='plab'+(fl>0&&fl<1?' new':''); g.userData.L.visible=g.visible&&namesOn;}});
  if(centerOn||!userCam) camAt(t);}
  let k=0;for(let i=0;i<SEQ.length;i++)if(t>=START[i]-1e-6)k=i; if(k!==cur){cur=k;renderSteps();}
  document.getElementById('slider').value=Math.round(t/TOTAL*1000);document.getElementById('tm').textContent=t.toFixed(1)+' / '+TOTAL.toFixed(1)+' s';}
function renderSteps(){const st=TX[lang].steps; document.getElementById('cap').innerHTML='<b>'+(cur+1)+'/'+SEQ.length+'</b> '+st[cur];
  document.querySelectorAll('#steps li').forEach((li,i)=>li.classList.toggle('on',i===cur));}
function buildList(){const t=TX[lang], ol=document.getElementById('steps'); ol.innerHTML='';
  t.steps.forEach((s,i)=>{const li=document.createElement('li');li.innerHTML='<span class="n">'+(i+1)+'</span><span>'+s+'</span>';li.onclick=()=>{playing=false;updBtn();T0=START[i]+SEQ[i][0]-0.001;setT(T0);};ol.appendChild(li);});
  document.getElementById('ttl').textContent=t.ttl;document.getElementById('tag').textContent=t.tag;document.getElementById('note').textContent=t.note;document.title=t.ttl;
  document.getElementById('matBadge').innerHTML=t.badge; document.getElementById('logoTxt').textContent=t.logo; document.getElementById('logoSel').value=ra3v; document.getElementById('namesTxt').textContent=t.names; document.getElementById('namesCb').checked=namesOn; document.getElementById('centerTxt').textContent=t.center; document.getElementById('centerCb').checked=centerOn; document.documentElement.lang=lang;
  document.getElementById('langEn').setAttribute('aria-pressed',String(lang==='en'));document.getElementById('langRu').setAttribute('aria-pressed',String(lang==='ru'));
  updBtn();cur=-1;setT(T0);}
let T0=0,playing=false,last=0,recorder=null;
function updBtn(){document.getElementById('play').textContent=playing?TX[lang].pause:TX[lang].play;document.getElementById('rec').textContent=recorder?TX[lang].recing:TX[lang].rec;}
document.getElementById('play').onclick=()=>{if(!playing&&T0>=TOTAL-0.01){T0=0;userCam=false;}playing=!playing;last=performance.now();updBtn();};
document.getElementById('prev').onclick=()=>{playing=false;updBtn();const k=Math.max(cur-1,0);T0=k===0?0:START[k]+SEQ[k][0]-0.001;setT(T0);};
document.getElementById('next').onclick=()=>{playing=false;updBtn();const k=Math.min(cur+1,SEQ.length-1);T0=START[k]+SEQ[k][0]-0.001;setT(T0);};
document.getElementById('slider').oninput=e=>{playing=false;updBtn();T0=e.target.value/1000*TOTAL;setT(T0);};
document.getElementById('rec').onclick=()=>{if(recorder||!canvas.captureStream||!window.MediaRecorder)return;
  const types=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];const mt=types.find(x=>MediaRecorder.isTypeSupported(x))||'';
  const chunks=[];recorder=new MediaRecorder(canvas.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:6e6}:undefined);
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{const ext=(recorder.mimeType||'').includes('mp4')?'mp4':'webm';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));a.download='RA_assembly.'+ext;document.body.appendChild(a);a.click();a.remove();recorder=null;updBtn();};
  T0=0;userCam=false;setT(0);playing=true;last=performance.now();recorder.start();updBtn();};
function setLang(l){lang=l;try{localStorage.setItem('fr4-lang',l);}catch(e){}buildList();}
document.getElementById('namesCb').onchange=e=>{namesOn=e.target.checked; try{localStorage.setItem('ra-names',namesOn?'1':'0');}catch(x){} setT(T0);};
document.getElementById('centerCb').onchange=e=>{centerOn=e.target.checked; if(centerOn) userCam=false; try{localStorage.setItem('ra-center',centerOn?'1':'0');}catch(x){} setT(T0);};
document.getElementById('logoSel').onchange=e=>{ra3v=e.target.value; try{localStorage.setItem('ra3var',ra3v);}catch(x){} setT(T0);};
document.getElementById('langEn').onclick=()=>setLang('en');document.getElementById('langRu').onclick=()=>setLang('ru');
function resize(){const w=viewer.clientWidth,h=viewer.clientHeight;renderer.setSize(w,h,false);labelRenderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();controls.handleResize&&controls.handleResize();}
new ResizeObserver(resize).observe(viewer);resize();
buildList();
(function loop(now){requestAnimationFrame(loop);
  if(playing){T0+=(now-last)/1000;last=now;if(T0>=TOTAL){T0=TOTAL;playing=false;updBtn();if(recorder)setTimeout(()=>recorder&&recorder.stop(),300);}setT(T0);}else last=now;
  controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera);})(performance.now());
const q=new URLSearchParams(location.search);if(q.get('embed'))document.querySelector('header').style.display='none';
fetch('drawings/MFG/RA_asm.json?v='+(q.get('v')||'')).then(r=>r.json()).then(D=>{build(D); if(q.get('autoplay')){playing=true;last=performance.now();updBtn();}}).catch(e=>{viewer.insertAdjacentHTML('beforeend','<div class="err">3D data failed to load</div>');});
</script>
<script src="site-fix.js"></script>
</body>
</html>
